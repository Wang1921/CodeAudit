rules:
  - id: java-xss
    message: |
      🚨 Cross-Site Scripting (CWE-79) Sink: HTTP 响应输出接收非字面量内容。
      若内容来自外部输入且未经 HTML/JS 编码，攻击者可注入
      `<script>alert(document.cookie)</script>` 窃取会话、劫持账户、水坑攻击。

      修复建议：
      1. 输出前用 OWASP Java Encoder：`Encode.forHtml(input)` / `Encode.forJavaScript(input)`；
      2. Spring MVC / Thymeleaf 用 `th:text`（自动转义）而非 `th:utext`（不转义）；
      3. JSP 用 `<c:out value="${x}"/>`，禁用 `<%= x %>` 原始拼接；
      4. CSP 头 `Content-Security-Policy: default-src 'self'` 限制可执行脚本来源。
    severity: ERROR
    languages: [java]
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation"
      owasp: "A03:2021 - Injection"
      vuln_class: "XSS"
      confidence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/79.html
        - https://owasp.org/www-project-java-encoder/
    patterns:
      - pattern-either:
          # HttpServletResponse.getWriter().print(...) 链式
          - pattern: $R.getWriter().print($X, ...)
          - pattern: $R.getWriter().println($X, ...)
          - pattern: $R.getWriter().write($X, ...)
          - pattern: $R.getWriter().append($X, ...)
          - pattern: $R.getWriter().format($FMT, $X, ...)
          - pattern: $R.getWriter().printf($FMT, $X, ...)
          # PrintWriter 变量形式
          - patterns:
              - pattern: $W.print($X, ...)
              - metavariable-type:
                  metavariable: $W
                  types:
                    - PrintWriter
                    - java.io.PrintWriter
                    - Writer
                    - java.io.Writer
          - patterns:
              - pattern: $W.println($X, ...)
              - metavariable-type:
                  metavariable: $W
                  types:
                    - PrintWriter
                    - java.io.PrintWriter
                    - Writer
                    - java.io.Writer
          - patterns:
              - pattern: $W.write($X, ...)
              - metavariable-type:
                  metavariable: $W
                  types:
                    - PrintWriter
                    - java.io.PrintWriter
                    - Writer
                    - java.io.Writer
          # ServletOutputStream
          - patterns:
              - pattern: $O.print($X, ...)
              - metavariable-type:
                  metavariable: $O
                  types:
                    - ServletOutputStream
                    - javax.servlet.ServletOutputStream
                    - jakarta.servlet.ServletOutputStream
          - patterns:
              - pattern: $O.println($X, ...)
              - metavariable-type:
                  metavariable: $O
                  types:
                    - ServletOutputStream
                    - javax.servlet.ServletOutputStream
                    - jakarta.servlet.ServletOutputStream
          # Spring Model/ModelMap.addAttribute("htmlContent", $X) —— Thymeleaf 模板若用 th:utext 渲染
          # 该字段会输出原始 HTML，构成 XSS。这是常见的 controller-level XSS sink，过去靠 LogicAuditor
          # 推理，现在补上直接规则。
          - patterns:
              - pattern-either:
                  - pattern: $M.addAttribute($KEY, $X)
              - metavariable-type:
                  metavariable: $M
                  types:
                    - Model
                    - org.springframework.ui.Model
                    - ModelMap
                    - org.springframework.ui.ModelMap
                    - ConcurrentModel
                    - org.springframework.ui.ConcurrentModel
              - metavariable-regex:
                  metavariable: $KEY
                  # 仅 key 名暗示 HTML/raw 输出时报（避免对普通 attribute 误报）
                  regex: '^"(?i).*(html|raw|content|body|markup|markdown|template).*"$'
          # ResponseEntity.body($X) —— 直接把内容塞响应体
          - patterns:
              - pattern: ResponseEntity.ok().body($X)
              - metavariable-regex:
                  metavariable: $X
                  # 排除明显安全形态：字面量、显式 escape 调用
                  regex: '^(?!").*'
      # 字面量排除（包含 format 字符串形式）
      - pattern-not: $R.getWriter().print("...", ...)
      - pattern-not: $R.getWriter().println("...", ...)
      - pattern-not: $R.getWriter().write("...", ...)
      - pattern-not: $R.getWriter().append("...", ...)
      - pattern-not: $W.print("...", ...)
      - pattern-not: $W.println("...", ...)
      - pattern-not: $W.write("...", ...)
      - pattern-not: $O.print("...", ...)
      - pattern-not: $O.println("...", ...)
      - pattern-not: $M.addAttribute($KEY, "...")
      # 显式 escape 调用排除
      - pattern-not: $R.getWriter().print(Encode.forHtml(...), ...)
      - pattern-not: $W.print(Encode.forHtml(...), ...)
      - pattern-not: $W.println(Encode.forHtml(...), ...)
      - pattern-not: $W.write(Encode.forHtml(...), ...)
      - pattern-not: $W.print(StringEscapeUtils.escapeHtml4(...), ...)
      - pattern-not: $W.println(StringEscapeUtils.escapeHtml4(...), ...)
