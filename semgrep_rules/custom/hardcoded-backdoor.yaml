rules:
  # ============================================================================
  # Hardcoded Backdoor (CWE-798) 规则
  #
  # 与 hardcoded-credentials 的区别：
  #   - hardcoded-credentials：变量赋值层面（如 String password = "admin123"）
  #   - hardcoded-backdoor：业务判定层面（如 if (input.equals("admin123")) → success）
  #
  # 即使值本身不算"凭据"（如 "dave" / "CaptainJack" / "magic_cookie"），
  # 只要被用作"等于字面量就放行"的判定逻辑，攻击者知道字面量后可直接绕过。
  # ============================================================================

  # ---------------- 直接 if (input.equals("literal")) + success/grant/login ----------------
  # v11 baseline 实测：SqlInjectionLesson6b 的 if (userid_6b.equals(getPassword())) 形态
  # 因为没有 Semgrep 规则覆盖只能靠 LogicAuditor，但 LogicAuditor 容易遗漏 getter 包装的 fallback。
  - id: java-hardcoded-backdoor-equals-literal
    message: |
      🚨 Hardcoded Backdoor (CWE-798): 直接用字符串字面量做"等于即放行"判定。

      模式：`if (userInput.equals("literal-value"))` 后接 success/grant/login/return true。
      即使 "literal-value" 看起来不像凭据，只要它是"被知道就能绕过的常量"，本质就是后门。

      WebGoat 案例：
        - `if ("CaptainJack".equals(username) && "BlackPearl".equals(password))` (InsecureLoginTask)
        - `if (userid_6b.equals(getPassword()))` 配合 `getPassword() { String password = "dave"; ... return password; }` (SqlInjectionLesson6b)
        - `if (input.equals("get_it_for_free"))` (ClientSideFilteringFreeAssignment)

      修复建议：
      1. 凭据查询走数据库 + 密码哈希（bcrypt/argon2）；
      2. 临时 token 走 SecureRandom 一次性生成，存 Redis 带过期；
      3. 业务白名单值放配置中心 + 加密存储，禁止源码内字面量。
    severity: ERROR
    languages: [java]
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      vuln_class: "Hardcoded Backdoor"
      confidence: LOW
      # WebGoat raw 实测 15 命中里 ~67% 是教学答题端点 FP（quiz 答案字面量比对），
      # 让 LLM 走 Red/Blue 验证后过滤。真 Backdoor（如 SqlInjectionLesson6b/InsecureLogin/
      # ClientSideFilteringFreeAssignment）会通过验证落 sink。
      taint_required: true
      references:
        - https://cwe.mitre.org/data/definitions/798.html
    patterns:
      - pattern-either:
          # if (input.equals("literal")) { ... return success/true ... }
          - pattern: |
              if ($INPUT.equals("$LITERAL")) {
                ...
                return success(...);
              }
          - pattern: |
              if ($INPUT.equals("$LITERAL")) {
                ...
                return $OK.build();
              }
          - pattern: |
              if ("$LITERAL".equals($INPUT)) {
                ...
                return success(...);
              }
          - pattern: |
              if ("$LITERAL".equals($INPUT)) {
                ...
                return $OK.build();
              }
          # if (input.equals("literal")) { return true; }
          - pattern: |
              if ($INPUT.equals("$LITERAL")) {
                ...
                return true;
              }
          # if (input == "literal")  ← Java 字符串"==" 通常是错的，但作为后门写法仍要抓
          - pattern: |
              if ($INPUT == "$LITERAL") {
                ...
                return success(...);
              }
      - metavariable-regex:
          metavariable: $LITERAL
          # 排除极短串 / 单字符 / 纯数字短 token（这些往往不是后门而是状态码）
          regex: '^.{4,}$'

  # ---------------- if (input.equals(getter())) 配合 getter 内硬编码 fallback ----------------
  # SqlInjectionLesson6b 形态：getter 里 `String password = "dave"` 然后查 DB（可能失败），
  # 失败时返回 fallback 字面量 → 攻击者输入 fallback 即可登录。
  # Semgrep 跨函数推断有限，这里只能粗匹配方法体内的 "String $V = "$LIT"" + "return $V"。
  - id: java-hardcoded-backdoor-getter-fallback
    message: |
      🚨 Hardcoded Backdoor (CWE-798): 凭据 getter 含硬编码 fallback。

      模式：方法内 `String var = "literal"` 然后中间访问外部资源（DB / API），
      失败时不抛错而是返回字面量 var → 攻击者输入该 fallback 字面量即可绕过认证。

      WebGoat 案例：SqlInjectionLesson6b.getPassword() 第 42 行 `String password = "dave"`，
      DB 查询失败时 catch SQLException 不抛错，直接返回 "dave"。

      修复建议：
      1. DB 查询失败必须抛 RuntimeException，不允许 fallback 凭据；
      2. fallback 值必须是不可登录的占位（如 `null` 或随机生成的不可猜值），不能是字面量；
      3. 单元测试覆盖"DB 不可达"场景，断言登录失败。
    severity: ERROR
    languages: [java]
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
        - "CWE-1188: Initialization of a Resource with an Insecure Default"
      owasp: "A07:2021 - Identification and Authentication Failures"
      vuln_class: "Hardcoded Backdoor"
      confidence: LOW
      # 需要 LogicAuditor 验证语义（fallback 是否真用于认证），不是 fast-path
      taint_required: true
    patterns:
      - pattern-either:
          - pattern: |
              $TYPE $METHOD(...) {
                String $VAR = "$LITERAL";
                ...
                try {
                  ...
                } catch (...) {
                  ...
                }
                return $VAR;
              }
          - pattern: |
              $TYPE $METHOD(...) {
                String $VAR = "$LITERAL";
                ...
                return ($VAR);
              }
      - metavariable-regex:
          metavariable: $LITERAL
          regex: '^.{3,}$'
      - metavariable-regex:
          metavariable: $METHOD
          # 限制方法名是 getter 类（getXxx）或 auth 相关，避免误报 toString/equals/hashCode
          regex: '^(get|find|load|lookup|verify|check|read|fetch|resolve).*'
