rules:
  - id: python-weak-random
    message: |
      🚨 Weak Random (CWE-330) Sink: random 模块产生非密码学安全随机数。
      random.random() / random.randint() / random.choice() 基于 Mersenne Twister，
      状态可预测，禁止用于 token / 密码 / 会话 ID / CSRF / 加密 IV 生成。

      该告警**无须污点链**（算法由代码本地决定），走 fast path 交给 BlueValidator 做静态定性：
      若用于 UI 动画 / 测试数据生成 / 非安全场景 → DEFENDED。

      修复建议：
      1. 安全随机：secrets.token_hex() / secrets.token_urlsafe() / secrets.choice()；
      2. 大随机整数：secrets.randbelow(n)；
      3. Python 3.6+ 优先 secrets 模块，random.SystemRandom() 次之。
    severity: WARNING
    languages: [python]
    metadata:
      cwe:
        - "CWE-330: Use of Insufficiently Random Values"
      owasp: "A02:2021 - Cryptographic Failures"
      vuln_class: "Weak Random"
      confidence: MEDIUM
      taint_required: false
      references:
        - https://cwe.mitre.org/data/definitions/330.html
        - https://docs.python.org/3/library/secrets.html
    patterns:
      - pattern-either:
          - pattern: random.random()
          - pattern: random.randint($A, $B)
          - pattern: random.randrange(...)
          - pattern: random.choice($SEQ)
          - pattern: random.choices($SEQ, ...)
          - pattern: random.sample($SEQ, $K)
          - pattern: random.uniform($A, $B)
          - pattern: random.shuffle($SEQ)
      # SystemRandom 用 OS 熵源，安全
      - pattern-not: random.SystemRandom().random()
      - pattern-not: random.SystemRandom().randint($A, $B)
      - pattern-not: random.SystemRandom().choice($SEQ)
      - pattern-not: random.SystemRandom().sample($SEQ, $K)
