rules:
  - id: python-hardcoded-credentials
    message: |
      🚨 Hardcoded Credentials (CWE-798 / CWE-259) Sink: 源码中硬编码了凭证或密钥。
      变量名含 `password` / `secret` / `token` / `apikey` / `access_key` / `private_key`
      且直接赋值为字符串字面量，视为硬编码凭证。

      风险：源码泄露（Git 仓库、日志、反编译）即等价于凭证泄露；
      同一凭证跨环境复用会放大影响面。

      该告警**无须污点链**（变量赋值点即漏洞），走 fast path 交给 BlueValidator
      结合上下文排除：测试类、示例值（"your-password-here"、"changeme"）、
      空串、默认占位值等假阳性。

      修复建议：
      1. 凭证经环境变量 / 配置中心 / 密钥管理服务（Vault / KMS）下发；
      2. Django/Flask：从环境变量读取（os.environ['DB_PASSWORD']）；
      3. 严禁将 .env / settings.py 里的真实凭证提交进 Git。
    severity: ERROR
    languages: [python]
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
        - "CWE-259: Use of Hard-coded Password"
      owasp: "A07:2021 - Identification and Authentication Failures"
      vuln_class: "Hardcoded Credentials"
      confidence: MEDIUM
      taint_required: false
      references:
        - https://cwe.mitre.org/data/definitions/798.html
    patterns:
      - pattern-either:
          - pattern: $NAME = "..."
          - pattern: $NAME = '...'
      - metavariable-regex:
          metavariable: $NAME
          regex: '(?i).*(password|passwd|pwd|secret|token|apikey|api_key|accesskey|access_key|privatekey|private_key|credential|auth_token|session_secret).*'
      # 排除明显的占位值 / 空串 / 极短测试值
      - pattern-not: $NAME = ""
      - pattern-not: $NAME = "changeme"
      - pattern-not: $NAME = "your-password-here"
      - pattern-not: $NAME = "xxx"
      - pattern-not: $NAME = "example"
      - pattern-not: $NAME = "test"
      - pattern-not: $NAME = "none"
      - pattern-not: $NAME = "null"
      - pattern-not: $NAME = "todo"
      - pattern-not: $NAME = "replace-me"
