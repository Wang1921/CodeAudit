rules:
  # ---------------- 静态 IV ----------------
  - id: python-static-iv
    message: |
      🚨 Static / Hardcoded IV (CWE-329) Sink:
      AES-CBC / CTR / GCM 模式使用硬编码字面量 IV。

      IV 的安全性依赖每次加密都是随机不重复的。固定 IV 导致：
      - CBC: 相同明文加密出相同密文，模式泄露；可发起 chosen-plaintext 攻击；
      - GCM: IV 重用直接泄露 authentication key（GHASH），攻击者可伪造任意密文；
      - CTR: IV+计数器重复等同于 keystream 重用 → 两份密文异或即还原明文。

      修复建议：
      1. 每次加密用 `os.urandom(16)` 生成新 IV（16 字节 for AES-CBC / 12 字节 for GCM）；
      2. 把 IV 随密文一起存储 / 传输（IV 不是秘密，但必须唯一）；
      3. 优先用 `cryptography` 库的高层 API（Fernet / AESGCM），自动管理 IV。
    severity: ERROR
    languages: [python]
    metadata:
      cwe:
        - "CWE-329: Generation of Predictable IV with CBC Mode"
      owasp: "A02:2021 - Cryptographic Failures"
      vuln_class: "Static IV"
      confidence: HIGH
      taint_required: false
      references:
        - https://cwe.mitre.org/data/definitions/329.html
    pattern-either:
      - pattern: AES.new($KEY, AES.MODE_CBC, iv=b"...")
      - pattern: AES.new($KEY, AES.MODE_CTR, nonce=b"...")
      - pattern: AES.new($KEY, AES.MODE_GCM, nonce=b"...")
      - pattern: AES.new($KEY, AES.MODE_CBC, iv="...")
      - pattern: Cipher(algorithms.AES($KEY), modes.CBC(b"..."))
      - pattern: Cipher(algorithms.AES($KEY), modes.CTR(b"..."))
      - pattern: Cipher(algorithms.AES($KEY), modes.GCM(b"..."))

  # ---------------- 常量 Salt ----------------
  - id: python-constant-salt
    message: |
      🚨 Constant Salt (CWE-760) Sink: 口令派生或哈希使用硬编码 salt。

      salt 的作用是让相同口令产生不同哈希，阻断"彩虹表"攻击。写死的 salt 让所有用户
      共享一个彩虹表前缀，等于没盐 —— 一旦泄露，批量爆破效率极高。

      修复建议：
      1. 每个用户 / 每次派生独立生成 salt：`os.urandom(16)`；
      2. salt 长度 ≥ 16 字节；
      3. 与哈希值一起存储（salt 非秘密）；
      4. 用现成的口令哈希库：bcrypt `gensalt()` / argon2-cffi `hash_password()` 内置随机 salt。
    severity: ERROR
    languages: [python]
    metadata:
      cwe:
        - "CWE-760: Use of a One-Way Hash with a Predictable Salt"
      owasp: "A02:2021 - Cryptographic Failures"
      vuln_class: "Constant Salt"
      confidence: HIGH
      taint_required: false
      references:
        - https://cwe.mitre.org/data/definitions/760.html
    pattern-either:
      - pattern: hashlib.pbkdf2_hmac($HASH, $PWD, b"...", ...)
      - pattern: hashlib.pbkdf2_hmac($HASH, $PWD, "...", ...)
      - pattern: hashlib.scrypt($PWD, salt=b"...", ...)
      - pattern: hashlib.scrypt($PWD, salt="...", ...)
      - pattern: bcrypt.hashpw($PWD, b"...")

  # ---------------- 非对称密钥长度不足 ----------------
  - id: python-insufficient-key-size
    message: |
      🚨 Insufficient Asymmetric Key Size (CWE-326) Sink: RSA / DSA 密钥长度 < 2048 bit。

      - NIST SP 800-131A 已弃用 RSA/DSA ≤ 1024 位；
      - 2048 位是当前最低安全要求，长期保密建议 3072 或 4096；
      - DSA 推荐切到 ECDSA（P-256 以上）或 EdDSA。

      修复建议：
      1. `RSA.generate(2048)` 或 `4096`；
      2. 签名场景改用 ECDSA（P-256 以上）或 Ed25519；
      3. TLS/JWT 等协议栈用 HMAC SHA-256 以上或 RS256/PS256 + RSA 2048+。
    severity: ERROR
    languages: [python]
    metadata:
      cwe:
        - "CWE-326: Inadequate Encryption Strength"
      owasp: "A02:2021 - Cryptographic Failures"
      vuln_class: "Weak Cryptography"
      confidence: HIGH
      taint_required: false
      references:
        - https://cwe.mitre.org/data/definitions/326.html
    patterns:
      - pattern-either:
          - pattern: RSA.generate($BITS)
          - pattern: Crypto.PublicKey.RSA.generate($BITS)
          - pattern: DSA.generate($BITS)
          - pattern: Crypto.PublicKey.DSA.generate($BITS)
      - metavariable-comparison:
          metavariable: $BITS
          comparison: $BITS < 2048
