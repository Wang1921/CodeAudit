rules:
  # ============================================================
  # Flask 路由提取规则（非漏洞，仅供 LogicAuditor 顶级入口扫描）。
  # check_id 含 "api" 让下游 semgrep_scanner._parse_route_result 的
  # `"api" in check_id.lower()` 判定为路由。
  # ============================================================

  - id: python-flask-api-route-get
    message: "发现 API (Flask GET) -> 路由: $RULE, 函数名: $FUNC"
    languages: [python]
    severity: INFO
    patterns:
      - pattern: |
          @$APP.route($RULE, methods=["GET", ...])
          def $FUNC(...):
              ...

  - id: python-flask-api-route-get-default
    message: "发现 API (Flask GET 默认) -> 路由: $RULE, 函数名: $FUNC"
    languages: [python]
    severity: INFO
    patterns:
      - pattern: |
          @$APP.route($RULE)
          def $FUNC(...):
              ...
      # 排除显式声明 methods 的（已被上面规则匹配）
      - pattern-not-inside: |
          @$APP.route($RULE, methods=[...])
          def $FUNC(...):
              ...

