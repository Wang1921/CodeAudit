rules:
  - id: java-jwt-none-algorithm
    message: |
      🚨 JWT with None / Unsigned Algorithm (CWE-347) Sink:
      使用了 `Algorithm.none()` 或不验证签名地 parse JWT。

      `alg: none` 意味着"无签名"，任何人都能伪造合法 JWT。加上 JWT 常被当认证令牌用，
      绕过校验等于整站认证绕过。CVE-2015-9235（jsonwebtoken）等多次大规模爆过。

      修复建议：
      1. 固定算法校验：`JWT.require(Algorithm.HMAC256(secret))`（auth0），
         或 `Jwts.parserBuilder().setSigningKey(key).build().parse(jwt)`（jjwt）；
      2. **绝不**在生产代码里出现 `Algorithm.none()` / `parseClaimsJwt`（无签）；
      3. 服务端拒绝 header 声明 `alg:none` 的 token；
      4. JWT 密钥用 HMAC SHA-256 以上或 RSA/ECDSA。
    severity: ERROR
    languages: [java]
    metadata:
      cwe:
        - "CWE-347: Improper Verification of Cryptographic Signature"
      owasp: "A02:2021 - Cryptographic Failures"
      vuln_class: "JWT None Algorithm"
      confidence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/347.html
        - https://auth0.com/blog/critical-vulnerabilities-in-json-web-token-libraries/
    pattern-either:
      # ---------------- auth0 java-jwt: Algorithm.none() ----------------
      - pattern: Algorithm.none()
      - pattern: com.auth0.jwt.algorithms.Algorithm.none()
      - pattern: JWT.require(Algorithm.none())
      - pattern: JWT.require(com.auth0.jwt.algorithms.Algorithm.none())
      - pattern: JWT.create().sign(Algorithm.none())
      - pattern: JWT.create().sign(com.auth0.jwt.algorithms.Algorithm.none())

      # ---------------- jjwt: parseClaimsJwt / parsePlaintextJwt 不验签 ----------------
      - patterns:
          - pattern: $PARSER.parseClaimsJwt($TOKEN)
          - metavariable-type:
              metavariable: $PARSER
              types:
                - JwtParser
                - io.jsonwebtoken.JwtParser
      - patterns:
          - pattern: $PARSER.parsePlaintextJwt($TOKEN)
          - metavariable-type:
              metavariable: $PARSER
              types:
                - JwtParser
                - io.jsonwebtoken.JwtParser

      # ---------------- Nimbus JWT: 仅 PlainJWT.parse（无签名 JWT） ----------------
      - pattern: PlainJWT.parse($TOKEN)
      - pattern: com.nimbusds.jwt.PlainJWT.parse($TOKEN)
