rules:
  - id: java-code-injection
    message: |
      🚨 Code / Expression Language Injection (CWE-94 / CWE-917) Sink:
      表达式 / 脚本引擎执行接收非字面量参数。

      攻击者可传入 Java 类构造 / `Runtime.exec` / 反射 等 payload 实现 RCE，
      这是历史上众多高危漏洞的公共底座：
      - **OGNL**: Struts2 S2-045 / S2-046 / S2-053（远程命令执行，多次爆发），CVE-2017-5638
      - **MVEL**: Drools 规则引擎 / BPM 流程引擎里的 `MVEL.eval(userInput)`
      - **Groovy**: Jenkins Script Console 未授权访问（历史漏洞无数）、`GroovyShell.evaluate`
      - **JEXL**: Apache Commons JEXL 2.x 反射未沙箱化
      - **ScriptEngine (JSR-223)**: Nashorn / graaljs 的 `ScriptEngine.eval(userInput)` —— CVE-2020-11975 Unomi

      修复建议：
      1. **表达式/脚本内容必须来自代码常量**，绝不接收外部输入；
      2. 必须接收外部输入时，使用沙箱 (GroovySandbox / SandboxedScriptEngine)，
         白名单允许的类 / 方法 / 字段；
      3. OGNL 侧：Struts2 升级到最新 + 启用 `devMode=false` + 表达式黑名单；
      4. ScriptEngine 侧：改用受限 `GraalJSScriptEngine` 并配 `HostAccess.NONE`；
      5. 业务逻辑能用 JSON Logic / rule DSL / SpEL 白名单实现的就别上 Groovy。
    severity: ERROR
    languages: [java]
    metadata:
      cwe:
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
        - "CWE-917: Improper Neutralization of Special Elements used in an Expression Language Statement"
      owasp: "A03:2021 - Injection"
      vuln_class: "Code Injection"
      confidence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/94.html
        - https://cwe.mitre.org/data/definitions/917.html
    patterns:
      - pattern-either:
          # ---------------- OGNL ----------------
          - pattern: Ognl.getValue($EXPR, ...)
          - pattern: ognl.Ognl.getValue($EXPR, ...)
          - pattern: Ognl.setValue($EXPR, ...)
          - pattern: ognl.Ognl.setValue($EXPR, ...)
          - pattern: Ognl.parseExpression($EXPR)
          - pattern: ognl.Ognl.parseExpression($EXPR)

          # ---------------- MVEL ----------------
          - pattern: MVEL.eval($EXPR, ...)
          - pattern: org.mvel2.MVEL.eval($EXPR, ...)
          - pattern: MVEL.evalToString($EXPR, ...)
          - pattern: org.mvel2.MVEL.evalToString($EXPR, ...)
          - pattern: MVEL.executeExpression($EXPR, ...)
          - pattern: org.mvel2.MVEL.executeExpression($EXPR, ...)
          - pattern: MVEL.compileExpression($EXPR)
          - pattern: org.mvel2.MVEL.compileExpression($EXPR)

          # ---------------- Groovy ----------------
          - pattern: new GroovyShell().evaluate($SCRIPT, ...)
          - pattern: new groovy.lang.GroovyShell().evaluate($SCRIPT, ...)
          - pattern: new GroovyShell().parse($SCRIPT, ...)
          - pattern: new groovy.lang.GroovyShell().parse($SCRIPT, ...)
          - patterns:
              - pattern-either:
                  - pattern: $G.evaluate($SCRIPT, ...)
                  - pattern: $G.parse($SCRIPT, ...)
              - metavariable-type:
                  metavariable: $G
                  types:
                    - GroovyShell
                    - groovy.lang.GroovyShell
                    - GroovyClassLoader
                    - groovy.lang.GroovyClassLoader
          - pattern: new GroovyClassLoader().parseClass($SCRIPT, ...)
          - pattern: new groovy.lang.GroovyClassLoader().parseClass($SCRIPT, ...)
          - pattern: new ConfigSlurper().parse($SCRIPT)
          - pattern: new groovy.util.ConfigSlurper().parse($SCRIPT)

          # ---------------- JEXL ----------------
          - patterns:
              - pattern-either:
                  - pattern: $JE.createExpression($EXPR)
                  - pattern: $JE.createScript($EXPR)
              - metavariable-type:
                  metavariable: $JE
                  types:
                    - JexlEngine
                    - org.apache.commons.jexl2.JexlEngine
                    - org.apache.commons.jexl3.JexlEngine

          # ---------------- javax.script.ScriptEngine (JSR 223) ----------------
          - patterns:
              - pattern: $SE.eval($SCRIPT, ...)
              - metavariable-type:
                  metavariable: $SE
                  types:
                    - ScriptEngine
                    - javax.script.ScriptEngine
                    - Invocable
                    - javax.script.Invocable
          - patterns:
              - pattern: $CS.eval(...)
              - metavariable-type:
                  metavariable: $CS
                  types:
                    - CompiledScript
                    - javax.script.CompiledScript

      # ---------------- 字面量排除 ----------------
      - pattern-not: Ognl.getValue("...", ...)
      - pattern-not: ognl.Ognl.getValue("...", ...)
      - pattern-not: Ognl.parseExpression("...")
      - pattern-not: MVEL.eval("...", ...)
      - pattern-not: MVEL.executeExpression("...")
      - pattern-not: MVEL.compileExpression("...")
      - pattern-not: new GroovyShell().evaluate("...", ...)
      - pattern-not: new GroovyShell().parse("...", ...)
      - pattern-not: $G.evaluate("...", ...)
      - pattern-not: $G.parse("...", ...)
      - pattern-not: $JE.createExpression("...")
      - pattern-not: $JE.createScript("...")
      - pattern-not: $SE.eval("...", ...)
