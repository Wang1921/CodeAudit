rules:
  - id: java-unsafe-reflection
    message: |
      🚨 Unsafe Reflection (CWE-470) Sink: 反射接口接收非字面量类名或方法名。
      若类名来自外部输入，攻击者可加载 `java.lang.ProcessBuilder` 或 `javax.naming.InitialContext`
      等敏感类实现 RCE；通过控制 `Method.invoke` 的参数也能攻击现有逻辑。这是 OGNL 注入 / Spring
      SpEL 注入 / FastJson autotype 等多条高危路径的底座。

      修复建议：
      1. 反射目标类名来自代码常量或严格白名单（如 `Set.of(A.class, B.class)`）；
      2. 不接受用户输入作为类名，改用 Strategy/Factory 枚举 + 工厂方法；
      3. 若确需动态加载，加 `Package.getPackage("com.trusted.")` 前缀校验；
      4. `Method.invoke(target, args)` 前校验 target 类型和方法白名单。
    severity: ERROR
    languages: [java]
    metadata:
      cwe:
        - "CWE-470: Use of Externally-Controlled Input to Select Classes or Code"
      owasp: "A03:2021 - Injection"
      vuln_class: "Unsafe Reflection"
      confidence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/470.html
    patterns:
      - pattern-either:
          # Class.forName 家族
          - pattern: Class.forName($NAME, ...)
          - pattern: java.lang.Class.forName($NAME, ...)
          # ClassLoader.loadClass
          - patterns:
              - pattern: $CL.loadClass($NAME, ...)
              - metavariable-type:
                  metavariable: $CL
                  types:
                    - ClassLoader
                    - java.lang.ClassLoader
                    - URLClassLoader
                    - java.net.URLClassLoader
          # Constructor.newInstance / Method.invoke 的非字面量调用者
          - patterns:
              - pattern: $C.newInstance(...)
              - metavariable-type:
                  metavariable: $C
                  types:
                    - Constructor
                    - java.lang.reflect.Constructor
          - patterns:
              - pattern: $M.invoke($TARGET, ...)
              - metavariable-type:
                  metavariable: $M
                  types:
                    - Method
                    - java.lang.reflect.Method
          # Field 反射读写（绕过访问控制）
          - patterns:
              - pattern-either:
                  - pattern: $F.get($TARGET)
                  - pattern: $F.set($TARGET, $VAL)
                  - pattern: $F.setAccessible($B)
              - metavariable-type:
                  metavariable: $F
                  types:
                    - Field
                    - java.lang.reflect.Field
          # AccessibleObject.setAccessible 显式禁用安全检查
          - patterns:
              - pattern: $AO.setAccessible(true)
              - metavariable-type:
                  metavariable: $AO
                  types:
                    - AccessibleObject
                    - java.lang.reflect.AccessibleObject
                    - Method
                    - java.lang.reflect.Method
                    - Field
                    - java.lang.reflect.Field
                    - Constructor
                    - java.lang.reflect.Constructor
          # sun.misc.Unsafe —— 绕过 JVM 内存保护的终极 API
          - patterns:
              - pattern-either:
                  - pattern: $U.putObject($TARGET, $OFFSET, $VAL)
                  - pattern: $U.getObject($TARGET, $OFFSET)
                  - pattern: $U.allocateInstance($CLASS)
              - metavariable-type:
                  metavariable: $U
                  types:
                    - Unsafe
                    - sun.misc.Unsafe
                    - jdk.internal.misc.Unsafe
      # 字面量类名排除
      - pattern-not: Class.forName("...", ...)
      - pattern-not: java.lang.Class.forName("...", ...)
      - pattern-not: $CL.loadClass("...", ...)
