rules:
  - id: java-xpath-injection
    message: |
      🚨 XPath Injection (CWE-643) Sink: XPath 表达式接收非字面量字符串。
      若表达式拼接了用户输入（如 `//user[name='` + name + `']`），
      攻击者可注入 `' or '1'='1` 绕过鉴权或枚举 XML 数据。

      修复建议：
      1. 使用 `XPath.setXPathVariableResolver()` 绑定变量（如 `$name`），
         表达式内用 `$name` 占位而非字符串拼接；
      2. 对输入做白名单校验（仅字母数字）；
      3. 避免把 XPath 作为鉴权唯一手段，改用结构化数据 + 代码校验。
    severity: ERROR
    languages: [java]
    metadata:
      cwe:
        - "CWE-643: Improper Neutralization of Data within XPath Expressions"
      owasp: "A03:2021 - Injection"
      vuln_class: "XPath Injection"
      confidence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/643.html
        - https://owasp.org/www-community/attacks/XPATH_Injection
    patterns:
      - pattern-either:
          # javax.xml.xpath.XPath
          - pattern: $XPATH.compile($EXPR)
          - pattern: $XPATH.evaluate($EXPR, ...)
          - pattern: $XPATH.evaluateExpression($EXPR, ...)
      # 限定表达式必须是 String，避免命中 Velocity.evaluate / Pattern.compile 等同名方法
      - metavariable-type:
          metavariable: $EXPR
          type: String
      # 字面量排除
      - pattern-not: $XPATH.compile("...")
      - pattern-not: $XPATH.evaluate("...", ...)
      - pattern-not: $XPATH.evaluateExpression("...", ...)
