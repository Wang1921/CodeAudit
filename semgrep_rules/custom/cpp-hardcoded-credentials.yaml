rules:
  - id: cpp-hardcoded-credentials
    message: |
      🚨 Hardcoded Credentials (CWE-798 / CWE-259) Sink: 源码中硬编码凭证/密钥。
      C/C++ 中常以字符串字面量形式硬编码密码、token、API key。
      二进制反编译极易提取，源码泄露即等价于凭证泄露。

      该告警**无须污点链**（变量赋值点即漏洞），走 fast path 交给 BlueValidator
      结合上下文排除：测试值、示例值、空串等假阳性。

      修复建议：
      1. 凭证经环境变量 / 配置文件 / KMS 下发；
      2. getenv("DB_PASSWORD") 读取环境变量；
      3. 严禁 const char *password = "..." / std::string password = "..." 形态。
    severity: ERROR
    languages: [cpp]
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
        - "CWE-259: Use of Hard-coded Password"
      owasp: "A07:2021 - Identification and Authentication Failures"
      vuln_class: "Hardcoded Credentials"
      confidence: MEDIUM
      taint_required: false
      references:
        - https://cwe.mitre.org/data/definitions/798.html
    patterns:
      - pattern-regex: '(?i)(std::string|QString|auto)\s+(password|passwd|pwd|secret|token|apikey|api_key|accesskey|access_key|privatekey|private_key|credential|auth_token)\w*\s*=\s*"([^"]{3,})"'
    # 排除明显占位值（通过 message 里的值匹配）
    # semgrep pattern-regex 无法直接排除字面量值，由 BlueValidator 结合上下文定性
