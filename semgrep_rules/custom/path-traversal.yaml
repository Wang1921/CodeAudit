rules:
  - id: java-path-traversal
    message: |
      🚨 Path Traversal (CWE-22) Sink: 文件 I/O 接口接收非字面量路径参数。
      若路径含 `../` 或绝对路径跳出预期目录，攻击者可读写任意文件（如
      `/etc/passwd`、配置文件、密钥）；写入场景更可能覆盖 webshell 达到 RCE。

      修复建议：
      1. 用 `Paths.get(baseDir).resolve(userInput).normalize().startsWith(baseDir)` 做前缀校验；
      2. 只允许白名单文件名（如仅 `[a-zA-Z0-9._-]+`）；
      3. 将用户输入作为查询键而非直接路径（数据库映射）；
      4. 下载 / 上传场景用内容 hash 作为文件名。
    severity: ERROR
    languages: [java]
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      owasp: "A01:2021 - Broken Access Control"
      vuln_class: "Path Traversal"
      confidence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/22.html
        - https://owasp.org/www-community/attacks/Path_Traversal
    patterns:
      - pattern-either:
          # java.io.File 构造（短名 + FQN）
          - pattern: new File($PATH)
          - pattern: new File($PARENT, $PATH)
          - pattern: new java.io.File($PATH)
          - pattern: new java.io.File($PARENT, $PATH)
          # java.nio.file.Paths
          - pattern: Paths.get($PATH, ...)
          - pattern: java.nio.file.Paths.get($PATH, ...)
          # java.io 流构造
          - pattern: new FileInputStream($PATH)
          - pattern: new FileOutputStream($PATH, ...)
          - pattern: new FileReader($PATH, ...)
          - pattern: new FileWriter($PATH, ...)
          - pattern: new java.io.FileInputStream($PATH)
          - pattern: new java.io.FileOutputStream($PATH, ...)
          - pattern: new java.io.FileReader($PATH, ...)
          - pattern: new java.io.FileWriter($PATH, ...)
          # java.nio.file.Files
          - pattern: Files.readAllBytes($PATH)
          - pattern: Files.readString($PATH, ...)
          - pattern: Files.newInputStream($PATH, ...)
          - pattern: Files.newOutputStream($PATH, ...)
          - pattern: Files.write($PATH, ...)
          - pattern: Files.copy($PATH, ...)
          - pattern: java.nio.file.Files.readAllBytes($PATH)
          - pattern: java.nio.file.Files.readString($PATH, ...)
          - pattern: java.nio.file.Files.newInputStream($PATH, ...)
          - pattern: java.nio.file.Files.newOutputStream($PATH, ...)
          - pattern: java.nio.file.Files.write($PATH, ...)
          - pattern: java.nio.file.Files.copy($PATH, ...)
          # java.io.RandomAccessFile
          - pattern: new RandomAccessFile($PATH, ...)
          - pattern: new java.io.RandomAccessFile($PATH, ...)
          # java.nio.channels.FileChannel.open
          - pattern: FileChannel.open($PATH, ...)
          - pattern: java.nio.channels.FileChannel.open($PATH, ...)
          # Class.getResourceAsStream / ClassLoader.getResourceAsStream
          - patterns:
              - pattern: $CL.getResourceAsStream($PATH)
              - metavariable-type:
                  metavariable: $CL
                  types:
                    - Class
                    - java.lang.Class
                    - ClassLoader
                    - java.lang.ClassLoader
          # JSch SFTP —— 远程文件路径遍历
          - patterns:
              - pattern-either:
                  - pattern: $SFTP.get($PATH, ...)
                  - pattern: $SFTP.put($SRC, $PATH, ...)
                  - pattern: $SFTP.ls($PATH)
                  - pattern: $SFTP.cd($PATH)
                  - pattern: $SFTP.rm($PATH)
              - metavariable-type:
                  metavariable: $SFTP
                  types:
                    - ChannelSftp
                    - com.jcraft.jsch.ChannelSftp
          # Spring Resource 系列 —— ClassPathResource / FileSystemResource /
          # UrlResource / PathResource / InputStreamResource 都接收路径/URL 字符串构造
          - pattern: new ClassPathResource($PATH, ...)
          - pattern: new org.springframework.core.io.ClassPathResource($PATH, ...)
          - pattern: new FileSystemResource($PATH)
          - pattern: new FileSystemResource($PATH, ...)
          - pattern: new org.springframework.core.io.FileSystemResource($PATH)
          - pattern: new org.springframework.core.io.FileSystemResource($PATH, ...)
          - pattern: new UrlResource($PATH)
          - pattern: new org.springframework.core.io.UrlResource($PATH)
          - pattern: new PathResource($PATH)
          - pattern: new org.springframework.core.io.PathResource($PATH)
          - pattern: new InputStreamResource($PATH, ...)
          - pattern: new org.springframework.core.io.InputStreamResource($PATH, ...)
          - pattern: ResourceUtils.getFile($PATH)
          - pattern: org.springframework.util.ResourceUtils.getFile($PATH)
          - pattern: ResourceUtils.getURL($PATH)
          - pattern: org.springframework.util.ResourceUtils.getURL($PATH)
          # Java 11+ Path.of —— 等价 Paths.get
          - pattern: Path.of($PATH, ...)
          - pattern: java.nio.file.Path.of($PATH, ...)
          # Hadoop HDFS Path (HFS / HDFS 文件封装) —— 路径遍历可读写 HDFS 任意位置
          - pattern: new Path($PATH)
          - pattern: new Path($PARENT, $PATH)
          - pattern: new org.apache.hadoop.fs.Path($PATH)
          - pattern: new org.apache.hadoop.fs.Path($PARENT, $PATH)
          # Spring MultipartFile.transferTo($PATH) —— 文件上传转存的典型路径遍历点
          - patterns:
              - pattern-either:
                  - pattern: $MF.transferTo($PATH)
              - metavariable-type:
                  metavariable: $MF
                  types:
                    - MultipartFile
                    - org.springframework.web.multipart.MultipartFile
          # Apache Commons IO FileUtils —— 常见文件读写工具类
          - pattern: FileUtils.readFileToString($PATH, ...)
          - pattern: FileUtils.readFileToByteArray($PATH)
          - pattern: FileUtils.readLines($PATH, ...)
          - pattern: FileUtils.writeStringToFile($PATH, ...)
          - pattern: FileUtils.write($PATH, ...)
          - pattern: FileUtils.writeByteArrayToFile($PATH, ...)
          - pattern: FileUtils.copyFile($PATH, ...)
          - pattern: FileUtils.copyDirectory($PATH, ...)
          - pattern: FileUtils.deleteDirectory($PATH)
          - pattern: FileUtils.forceDelete($PATH)
          - pattern: org.apache.commons.io.FileUtils.readFileToString($PATH, ...)
          - pattern: org.apache.commons.io.FileUtils.writeStringToFile($PATH, ...)
          - pattern: org.apache.commons.io.FileUtils.copyFile($PATH, ...)
          # Guava Files —— 同样常见的文件工具类
          - pattern: com.google.common.io.Files.asByteSource($PATH)
          - pattern: com.google.common.io.Files.asCharSource($PATH, ...)
          - pattern: com.google.common.io.Files.readLines($PATH, ...)
          # Apache VFS
          - patterns:
              - pattern: $FS.resolveFile($PATH, ...)
              - metavariable-type:
                  metavariable: $FS
                  types:
                    - FileSystemManager
                    - org.apache.commons.vfs2.FileSystemManager
      # 字面量排除（短名 + FQN）
      - pattern-not: new File("...")
      - pattern-not: new File("...", "...")
      - pattern-not: new java.io.File("...")
      - pattern-not: new java.io.File("...", "...")
      # Paths.get 是 varargs(String first, String... more),旧 "...", ... 形态会
      # 误排除 Paths.get("/safe", userInput) 这种"第 2+ 参数可控"的真漏洞。
      # 改为列举多 arity 全字面量。
      - pattern-not: Paths.get("...")
      - pattern-not: Paths.get("...", "...")
      - pattern-not: Paths.get("...", "...", "...")
      - pattern-not: Paths.get("...", "...", "...", "...")
      - pattern-not: java.nio.file.Paths.get("...")
      - pattern-not: java.nio.file.Paths.get("...", "...")
      - pattern-not: java.nio.file.Paths.get("...", "...", "...")
      - pattern-not: java.nio.file.Paths.get("...", "...", "...", "...")
      # Path.of(Java 11+) 同 Paths.get 的 varargs 语义
      - pattern-not: Path.of("...")
      - pattern-not: Path.of("...", "...")
      - pattern-not: Path.of("...", "...", "...")
      - pattern-not: java.nio.file.Path.of("...")
      - pattern-not: java.nio.file.Path.of("...", "...")
      - pattern-not: java.nio.file.Path.of("...", "...", "...")
      - pattern-not: new FileInputStream("...")
      - pattern-not: new FileOutputStream("...", ...)
      - pattern-not: new FileReader("...", ...)
      - pattern-not: new FileWriter("...", ...)
      - pattern-not: new java.io.FileInputStream("...")
      - pattern-not: new java.io.FileOutputStream("...", ...)
      - pattern-not: new java.io.FileReader("...", ...)
      - pattern-not: new java.io.FileWriter("...", ...)
      - pattern-not: Files.readAllBytes("...")
      - pattern-not: Files.readString("...", ...)
      - pattern-not: Files.newInputStream("...", ...)
      - pattern-not: Files.newOutputStream("...", ...)
      - pattern-not: Files.write("...", ...)
      - pattern-not: Files.copy("...", ...)
      - pattern-not: java.nio.file.Files.readAllBytes("...")
      - pattern-not: java.nio.file.Files.readString("...", ...)
      - pattern-not: java.nio.file.Files.newInputStream("...", ...)
      - pattern-not: java.nio.file.Files.newOutputStream("...", ...)
      - pattern-not: java.nio.file.Files.write("...", ...)
      - pattern-not: java.nio.file.Files.copy("...", ...)
      - pattern-not: new RandomAccessFile("...", ...)
      - pattern-not: new java.io.RandomAccessFile("...", ...)
      - pattern-not: FileChannel.open(Paths.get("..."), ...)
      - pattern-not: $CL.getResourceAsStream("...")
      # $SFTP.get/ls/cd 字面量排除曾在这里,但 $SFTP 无 metavariable-type 约束,
      # 误把 Paths.get("/safe", u) 匹配为 $SFTP.get(...) 形态,导致 Path Traversal
      # 真漏洞被静默排除. 移除这 3 条,主 pattern 已对 $SFTP 限定 ChannelSftp 类型,
      # 字面量 SFTP 调用本来就不会进入主 pattern,无需 pattern-not 补充.
      - pattern-not: new ClassPathResource("...", ...)
      - pattern-not: new org.springframework.core.io.ClassPathResource("...", ...)
      - pattern-not: new FileSystemResource("...")
      - pattern-not: new FileSystemResource("...", ...)
      - pattern-not: new org.springframework.core.io.FileSystemResource("...")
      - pattern-not: new UrlResource("...")
      - pattern-not: new PathResource("...")
      - pattern-not: new org.springframework.core.io.PathResource("...")
      - pattern-not: ResourceUtils.getFile("...")
      - pattern-not: org.springframework.util.ResourceUtils.getFile("...")
      - pattern-not: ResourceUtils.getURL("...")
      - pattern-not: Path.of("...", ...)
      - pattern-not: java.nio.file.Path.of("...", ...)
      - pattern-not: new Path("...")
      - pattern-not: new Path("...", "...")
      - pattern-not: new org.apache.hadoop.fs.Path("...")
      - pattern-not: $MF.transferTo("...")
      - pattern-not: FileUtils.readFileToString("...", ...)
      - pattern-not: FileUtils.readFileToByteArray("...")
      - pattern-not: FileUtils.readLines("...", ...)
      - pattern-not: FileUtils.writeStringToFile("...", ...)
      - pattern-not: FileUtils.write("...", ...)
      - pattern-not: FileUtils.writeByteArrayToFile("...", ...)
      - pattern-not: FileUtils.copyFile("...", ...)
      - pattern-not: FileUtils.copyDirectory("...", ...)
      - pattern-not: FileUtils.deleteDirectory("...")
      - pattern-not: FileUtils.forceDelete("...")
      - pattern-not: $FS.resolveFile("...", ...)
      - pattern-not: new File(SafeText.safePath(...))
      - pattern-not: new File(SafeText.safePathIncludeZH(...))
      - pattern-not: new java.io.File(SafeText.safePath(...))
      - pattern-not: new java.io.File(SafeText.safePathIncludeZH(...))
      - pattern-not: Paths.get(SafeText.safePath(...), ...)
      - pattern-not: java.nio.file.Paths.get(SafeText.safePath(...), ...)
      - pattern-not: new FileOutputStream(SafeText.safePath(...), ...)
      - pattern-not: new FileOutputStream(SafeText.safeFilePath(...))
      - pattern-not: new java.io.FileOutputStream(SafeText.safePath(...), ...)
      - pattern-not: Files.newInputStream(Paths.get(SafeText.safePath(...)), ...)
      - pattern-not: Files.newOutputStream(Paths.get(SafeText.safePath(...)), ...)
      - pattern-not: java.nio.file.Files.newOutputStream(Paths.get(SafeText.safePath(...)), ...)
