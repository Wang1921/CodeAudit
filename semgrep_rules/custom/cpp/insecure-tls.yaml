rules:
  # ---------------- SSL_VERIFY_NONE ----------------
  - id: cpp-insecure-tls-no-verify
    message: |
      🚨 Insecure TLS (CWE-295) Sink: OpenSSL 关闭了证书校验。

      `SSL_CTX_set_verify(ctx, SSL_VERIFY_NONE, NULL)` 让客户端不校验服务器证书，
      中间人可冒充任意 HTTPS 站点截获 / 篡改流量。

      修复建议：
      1. `SSL_CTX_set_verify(ctx, SSL_VERIFY_PEER, NULL)` 强制校验；
      2. `SSL_CTX_load_verify_locations(ctx, ca_bundle, NULL)` 指定信任根；
      3. 自签名场景把 CA 证书加入信任库，而非关校验；
      4. 生产环境绝不出现 `SSL_VERIFY_NONE`。
    severity: ERROR
    languages: [c, cpp]
    metadata:
      cwe:
        - "CWE-295: Improper Certificate Validation"
      owasp: "A02:2021 - Cryptographic Failures"
      vuln_class: "Insecure TLS"
      confidence: HIGH
      taint_required: false
      references:
        - https://cwe.mitre.org/data/definitions/295.html
    pattern-either:
      - pattern: SSL_CTX_set_verify($CTX, SSL_VERIFY_NONE, ...)
      - pattern: SSL_CTX_set_verify($CTX, 0, ...)
      - pattern: SSL_set_verify($SSL, SSL_VERIFY_NONE, ...)
      - pattern: SSL_set_verify($SSL, 0, ...)

  # ---------------- 弱密码套件 ----------------
  - id: cpp-insecure-tls-weak-cipher
    message: |
      🚨 Insecure TLS (CWE-327) Sink: OpenSSL 允许弱密码套件。

      `SSL_CTX_set_cipher_list(ctx, "ALL")` / `"eNULL"` / `"NULL"` / `"EXPORT"`
      允许无加密或弱加密套件，中间人可降级或直接读取流量。

      修复建议：
      1. 用 `SSL_CTX_set_ciphersuites(ctx, "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256")`；
      2. TLS 1.2 用 `"HIGH:!aNULL:!MD5:!RC4:!EXPORT:!eNULL"`；
      3. 禁用 RC4 / DES / EXPORT / NULL / eNULL；
      4. 优先用 TLS 1.3（默认安全套件）。
    severity: WARNING
    languages: [c, cpp]
    metadata:
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: "A02:2021 - Cryptographic Failures"
      vuln_class: "Insecure TLS"
      confidence: MEDIUM
      taint_required: false
      references:
        - https://cwe.mitre.org/data/definitions/327.html
    pattern-either:
      - pattern: SSL_CTX_set_cipher_list($CTX, "ALL")
      - pattern: SSL_CTX_set_cipher_list($CTX, "eNULL")
      - pattern: SSL_CTX_set_cipher_list($CTX, "NULL")
      - pattern: SSL_CTX_set_cipher_list($CTX, "EXPORT")
      - pattern: SSL_CTX_set_cipher_list($CTX, "LOW")
      - pattern: SSL_CTX_set_cipher_list($CTX, "RC4")
      - pattern: SSL_CTX_set_cipher_list($CTX, "ALL:eNULL")
      - pattern: SSL_CTX_set_cipher_list($CTX, "DEFAULT")
