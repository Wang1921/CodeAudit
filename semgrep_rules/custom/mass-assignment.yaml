rules:
  # ---------------- BeanUtils 全字段拷贝（最常见的 Mass Assignment 模式） ----------------
  # Apache commons-beanutils 的 `BeanUtils.copyProperties` / `populate` / Spring 自家
  # `org.springframework.beans.BeanUtils.copyProperties` 都会把"源对象 / Map 里的全部字段"
  # 不加过滤地塞给目标对象。当源是 HTTP 入参（Map<String,String> / DTO）、目标是 Entity 时，
  # 攻击者可注入 `isAdmin=true` / `role=ADMIN` / `balance=999999` 等敏感字段。
  - id: java-mass-assignment-beanutils
    message: |
      🚨 Mass Assignment (CWE-915) Sink: 使用 BeanUtils 做全字段拷贝。
      若源对象/Map 来自外部请求且目标是 Entity（含 isAdmin / role / balance 等敏感字段），
      攻击者可注入这些字段绕过业务边界。

      修复建议：
      1. 在目标 Entity 上加 `@JsonIgnore` / `@JsonProperty(access = READ_ONLY)` 标记不可外部赋值字段；
      2. 改用 DTO 隔离层：外部请求 → ReqDTO → 手动映射到 Entity，绝不直接 copyProperties；
      3. 若坚持用 BeanUtils，传 `ignoreProperties` 显式排除敏感字段：
         `BeanUtils.copyProperties(src, dst, "id", "isAdmin", "role")`；
      4. 校验阶段在 `@InitBinder` 里 `setDisallowedFields("isAdmin", "role")`。
    severity: ERROR
    languages: [java]
    metadata:
      cwe:
        - "CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      vuln_class: "Mass Assignment"
      confidence: MEDIUM
      # fast-path：拷贝调用本身即漏洞结构，无需污点链。
      taint_required: false
      references:
        - https://cwe.mitre.org/data/definitions/915.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Mass_Assignment_Cheat_Sheet.html
    patterns:
      - pattern-either:
          # Apache commons-beanutils
          - pattern: BeanUtils.copyProperties($SRC, $DST)
          - pattern: org.apache.commons.beanutils.BeanUtils.copyProperties($SRC, $DST)
          - pattern: BeanUtils.populate($DST, $MAP)
          - pattern: org.apache.commons.beanutils.BeanUtils.populate($DST, $MAP)
          # Spring 自家 BeanUtils（同样不过滤敏感字段，只在显式传 ignoreProperties 时才安全）
          - pattern: org.springframework.beans.BeanUtils.copyProperties($SRC, $DST)
          # PropertyUtils.copyProperties —— commons-beanutils 同族
          - pattern: PropertyUtils.copyProperties($DST, $SRC)
          - pattern: org.apache.commons.beanutils.PropertyUtils.copyProperties($DST, $SRC)
      # 已显式过滤敏感字段则视为安全（Spring BeanUtils 第 3+ 个参数是 ignoreProperties varargs）
      - pattern-not: BeanUtils.copyProperties($SRC, $DST, "...")
      - pattern-not: BeanUtils.copyProperties($SRC, $DST, "...", ...)
      - pattern-not: org.springframework.beans.BeanUtils.copyProperties($SRC, $DST, "...")
      - pattern-not: org.springframework.beans.BeanUtils.copyProperties($SRC, $DST, "...", ...)

  # ---------------- @InitBinder 缺失 disallowedFields / allowedFields 白名单 ----------------
  # Spring 的 @InitBinder 是 controller 级别的字段绑定钩子。
  # 一个 controller 用了 @ModelAttribute Entity 但没有 @InitBinder + setDisallowedFields / setAllowedFields
  # 就等于允许外部请求覆盖 Entity 全部字段。
  #
  # 注意：本规则做 controller 级模式匹配，semgrep 难以做"类层级有/无某方法"的精确判定，
  # 因此走"有 @InitBinder 但没传 disallowedFields/allowedFields"这条偏严的检测，
  # 把"完全没写 @InitBinder 但用 @ModelAttribute"留给 LogicAuditor 推理。
  - id: java-mass-assignment-initbinder-no-whitelist
    message: |
      🚨 Mass Assignment (CWE-915) Sink: @InitBinder 钩子未配置字段白名单/黑名单。

      Spring @InitBinder 是给 controller 绑定 @ModelAttribute 时定制字段过滤的入口。
      只声明 @InitBinder 而不调用 `binder.setAllowedFields(...)` 或 `binder.setDisallowedFields(...)`，
      等同于"用了钩子但啥都没拦"，外部请求仍能覆盖 Entity 全部字段。

      修复建议：
      ```java
      @InitBinder
      public void initBinder(WebDataBinder binder) {
        binder.setAllowedFields("username", "email", "password");
        // 或反向：binder.setDisallowedFields("id", "isAdmin", "role", "balance");
      }
      ```
    severity: WARNING
    languages: [java]
    metadata:
      cwe:
        - "CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      vuln_class: "Mass Assignment"
      confidence: LOW
      taint_required: false
    patterns:
      - pattern: |
          @InitBinder
          $RT $M($BINDER_TYPE $B) {
            ...
          }
      - pattern-not: |
          @InitBinder
          $RT $M($BINDER_TYPE $B) {
            ...
            $B.setAllowedFields(...);
            ...
          }
      - pattern-not: |
          @InitBinder
          $RT $M($BINDER_TYPE $B) {
            ...
            $B.setDisallowedFields(...);
            ...
          }

  # ---------------- ObjectMapper.readValue 直接反序列化到 Entity 类 ----------------
  # 把外部 JSON / YAML 直接 `readValue(input, UserEntity.class)` 等同 @RequestBody UserEntity，
  # 同样会把外部传入的 isAdmin / role 字段塞进 Entity。
  - id: java-mass-assignment-objectmapper-readvalue
    message: |
      🚨 Mass Assignment (CWE-915) Sink: ObjectMapper.readValue 直接反序列化到目标类。
      若目标类是 Entity（含 isAdmin / role / balance 等敏感字段）且未加 `@JsonIgnore`，
      攻击者可在 JSON 里塞进任意字段。

      修复建议：
      1. 用 DTO 接收外部 JSON，再手动映射到 Entity；
      2. 或在 Entity 上加 `@JsonIgnoreProperties(allowGetters = true, ignoreUnknown = true)`
         + 敏感字段加 `@JsonProperty(access = READ_ONLY)`；
      3. 配置 `objectMapper.disable(FAIL_ON_UNKNOWN_PROPERTIES)` 不等于安全，关键是字段白名单。
    severity: WARNING
    languages: [java]
    metadata:
      cwe:
        - "CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      vuln_class: "Mass Assignment"
      confidence: LOW
      taint_required: false
    patterns:
      - pattern-either:
          - pattern: $OM.readValue($INPUT, $CLASS)
          - pattern: $OM.readValue($INPUT, $CLASS, ...)
      - metavariable-type:
          metavariable: $OM
          types:
            - ObjectMapper
            - com.fasterxml.jackson.databind.ObjectMapper
            - YAMLMapper
            - com.fasterxml.jackson.dataformat.yaml.YAMLMapper
            - XmlMapper
            - com.fasterxml.jackson.dataformat.xml.XmlMapper
      # 字面量 JSON 不算外部输入
      - pattern-not: $OM.readValue("...", $CLASS)
      - pattern-not: $OM.readValue("...", $CLASS, ...)
