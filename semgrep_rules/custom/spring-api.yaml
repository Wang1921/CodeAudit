rules:
  # 场景一：匹配同时拥有类级别 @RequestMapping 和 方法级别注解的接口
  - id: spring-api-with-class-mapping
    message: "发现 API (带类前缀) -> 类基础路径: $BASE_ARGS, 方法路径: $METHOD_ARGS, 方法名: $METHOD"
    languages:
      - java
    severity: INFO
    patterns:
      - pattern-inside: |
          @RequestMapping($BASE_ARGS)
          class $CLASS {
            ...
          }
      - pattern-either:
          - pattern: |
              @RequestMapping($METHOD_ARGS)
              $RET $METHOD(...) { ... }
          - pattern: |
              @GetMapping($METHOD_ARGS)
              $RET $METHOD(...) { ... }
          - pattern: |
              @PostMapping($METHOD_ARGS)
              $RET $METHOD(...) { ... }
          - pattern: |
              @PutMapping($METHOD_ARGS)
              $RET $METHOD(...) { ... }
          - pattern: |
              @DeleteMapping($METHOD_ARGS)
              $RET $METHOD(...) { ... }

  # 场景二：匹配仅在方法级别定义路由的接口（排除掉被场景一匹配的情况）
  - id: spring-api-method-only
    message: "发现 API (无类前缀) -> 方法路径: $METHOD_ARGS, 方法名: $METHOD"
    languages:
      - java
    severity: INFO
    patterns:
      - pattern-not-inside: |
          @RequestMapping($BASE_ARGS)
          class $CLASS {
            ...
          }
      - pattern-either:
          - pattern: |
              @RequestMapping($METHOD_ARGS)
              $RET $METHOD(...) { ... }
          - pattern: |
              @GetMapping($METHOD_ARGS)
              $RET $METHOD(...) { ... }
          - pattern: |
              @PostMapping($METHOD_ARGS)
              $RET $METHOD(...) { ... }
          - pattern: |
              @PutMapping($METHOD_ARGS)
              $RET $METHOD(...) { ... }
          - pattern: |
              @DeleteMapping($METHOD_ARGS)
              $RET $METHOD(...) { ... }
