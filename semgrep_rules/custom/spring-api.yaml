rules:
  # ============================================================
  # 设计说明：
  # check_id 名字里编码 HTTP 方法名（get/post/put/delete/patch），
  # 让下游 semgrep_scanner._parse_route_result 的 `"post" in check_id.lower()`
  # 直接生效，无需依赖 Semgrep message 中的 metavar 渲染。
  #
  # `pattern-inside` 用类级 @RequestMapping 限定带类前缀的场景；
  # `pattern-not-inside` 对应仅在方法上声明的场景，避免重复匹配。
  # ============================================================

  # ---------------- 场景一：类上有 @RequestMapping ----------------

  - id: spring-api-get-with-class-mapping
    message: "发现 API (带类前缀, GET) -> 类基础路径: $BASE_ARGS, 方法路径: $METHOD_ARGS, 方法名: $METHOD"
    languages: [java]
    severity: INFO
    patterns:
      - pattern-inside: |
          @RequestMapping($BASE_ARGS)
          class $CLASS { ... }
      - pattern: |
          @GetMapping($METHOD_ARGS)
          $RET $METHOD(...) { ... }

  - id: spring-api-post-with-class-mapping
    message: "发现 API (带类前缀, POST) -> 类基础路径: $BASE_ARGS, 方法路径: $METHOD_ARGS, 方法名: $METHOD"
    languages: [java]
    severity: INFO
    patterns:
      - pattern-inside: |
          @RequestMapping($BASE_ARGS)
          class $CLASS { ... }
      - pattern: |
          @PostMapping($METHOD_ARGS)
          $RET $METHOD(...) { ... }

  - id: spring-api-put-with-class-mapping
    message: "发现 API (带类前缀, PUT) -> 类基础路径: $BASE_ARGS, 方法路径: $METHOD_ARGS, 方法名: $METHOD"
    languages: [java]
    severity: INFO
    patterns:
      - pattern-inside: |
          @RequestMapping($BASE_ARGS)
          class $CLASS { ... }
      - pattern: |
          @PutMapping($METHOD_ARGS)
          $RET $METHOD(...) { ... }

  - id: spring-api-delete-with-class-mapping
    message: "发现 API (带类前缀, DELETE) -> 类基础路径: $BASE_ARGS, 方法路径: $METHOD_ARGS, 方法名: $METHOD"
    languages: [java]
    severity: INFO
    patterns:
      - pattern-inside: |
          @RequestMapping($BASE_ARGS)
          class $CLASS { ... }
      - pattern: |
          @DeleteMapping($METHOD_ARGS)
          $RET $METHOD(...) { ... }

  - id: spring-api-patch-with-class-mapping
    message: "发现 API (带类前缀, PATCH) -> 类基础路径: $BASE_ARGS, 方法路径: $METHOD_ARGS, 方法名: $METHOD"
    languages: [java]
    severity: INFO
    patterns:
      - pattern-inside: |
          @RequestMapping($BASE_ARGS)
          class $CLASS { ... }
      - pattern: |
          @PatchMapping($METHOD_ARGS)
          $RET $METHOD(...) { ... }

  # 类上 @RequestMapping + 方法也用 @RequestMapping（未指定 method 时 = ALL；下游按 GET 兜底）
  - id: spring-api-requestmapping-with-class-mapping
    message: "发现 API (带类前缀, 方法级 RequestMapping) -> 类基础路径: $BASE_ARGS, 方法路径: $METHOD_ARGS, 方法名: $METHOD"
    languages: [java]
    severity: INFO
    patterns:
      - pattern-inside: |
          @RequestMapping($BASE_ARGS)
          class $CLASS { ... }
      - pattern: |
          @RequestMapping($METHOD_ARGS)
          $RET $METHOD(...) { ... }

  # ---------------- 场景二：仅在方法级声明 ----------------

  - id: spring-api-get-method-only
    message: "发现 API (无类前缀, GET) -> 方法路径: $METHOD_ARGS, 方法名: $METHOD"
    languages: [java]
    severity: INFO
    patterns:
      - pattern-not-inside: |
          @RequestMapping($BASE_ARGS)
          class $CLASS { ... }
      - pattern: |
          @GetMapping($METHOD_ARGS)
          $RET $METHOD(...) { ... }

  - id: spring-api-post-method-only
    message: "发现 API (无类前缀, POST) -> 方法路径: $METHOD_ARGS, 方法名: $METHOD"
    languages: [java]
    severity: INFO
    patterns:
      - pattern-not-inside: |
          @RequestMapping($BASE_ARGS)
          class $CLASS { ... }
      - pattern: |
          @PostMapping($METHOD_ARGS)
          $RET $METHOD(...) { ... }

  - id: spring-api-put-method-only
    message: "发现 API (无类前缀, PUT) -> 方法路径: $METHOD_ARGS, 方法名: $METHOD"
    languages: [java]
    severity: INFO
    patterns:
      - pattern-not-inside: |
          @RequestMapping($BASE_ARGS)
          class $CLASS { ... }
      - pattern: |
          @PutMapping($METHOD_ARGS)
          $RET $METHOD(...) { ... }

  - id: spring-api-delete-method-only
    message: "发现 API (无类前缀, DELETE) -> 方法路径: $METHOD_ARGS, 方法名: $METHOD"
    languages: [java]
    severity: INFO
    patterns:
      - pattern-not-inside: |
          @RequestMapping($BASE_ARGS)
          class $CLASS { ... }
      - pattern: |
          @DeleteMapping($METHOD_ARGS)
          $RET $METHOD(...) { ... }

  - id: spring-api-patch-method-only
    message: "发现 API (无类前缀, PATCH) -> 方法路径: $METHOD_ARGS, 方法名: $METHOD"
    languages: [java]
    severity: INFO
    patterns:
      - pattern-not-inside: |
          @RequestMapping($BASE_ARGS)
          class $CLASS { ... }
      - pattern: |
          @PatchMapping($METHOD_ARGS)
          $RET $METHOD(...) { ... }

  - id: spring-api-requestmapping-method-only
    message: "发现 API (无类前缀, 方法级 RequestMapping) -> 方法路径: $METHOD_ARGS, 方法名: $METHOD"
    languages: [java]
    severity: INFO
    patterns:
      - pattern-not-inside: |
          @RequestMapping($BASE_ARGS)
          class $CLASS { ... }
      - pattern: |
          @RequestMapping($METHOD_ARGS)
          $RET $METHOD(...) { ... }
