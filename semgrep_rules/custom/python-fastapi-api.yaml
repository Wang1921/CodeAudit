rules:
  # ============================================================
  # FastAPI 路由提取规则（非漏洞，仅供 LogicAuditor 顶级入口扫描）。
  # check_id 含 "api" 让下游 semgrep_scanner._parse_route_result 的
  # `"api" in check_id.lower()` 判定为路由。
  # ============================================================

  - id: python-fastapi-api-route-get
    message: "发现 API (FastAPI GET) -> 路由: $RULE, 函数名: $FUNC"
    languages: [python]
    severity: INFO
    patterns:
      - pattern: |
          @$APP.get($RULE)
          def $FUNC(...):
              ...

  - id: python-fastapi-api-route-get-async
    message: "发现 API (FastAPI GET async) -> 路由: $RULE, 函数名: $FUNC"
    languages: [python]
    severity: INFO
    patterns:
      - pattern: |
          @$APP.get($RULE)
          async def $FUNC(...):
              ...

  - id: python-fastapi-api-route-post
    message: "发现 API (FastAPI POST) -> 路由: $RULE, 函数名: $FUNC"
    languages: [python]
    severity: INFO
    patterns:
      - pattern: |
