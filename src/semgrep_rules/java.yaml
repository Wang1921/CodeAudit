rules:
  - id: java-sqli
    pattern-either:
      - pattern: $X.executeQuery($Y)
      - pattern: $X.execute($Y)
      - pattern: $X.executeUpdate($Y)
      - pattern: $X.executeLargeUpdate($Y)
    languages: [java]
    severity: ERROR
    message: "SQL Injection risk: User input may enter SQL query"
    metadata:
      cwe: "CWE-89"
      vuln_class: "SQL Injection"

  - id: java-sqli-prepared-statement-missing
    pattern-either:
      - pattern: $X.createStatement($Y)
      - pattern: $X.createStatement($Y, $Z)
    languages: [java]
    severity: WARNING
    message: "Potential SQL Injection risk: Use PreparedStatement instead of Statement"
    metadata:
      cwe: "CWE-89"
      vuln_class: "SQL Injection"

  - id: java-command-injection-runtime
    pattern-either:
      - pattern: Runtime.getRuntime().exec($X)
      - pattern: Runtime.exec($X)
      - pattern: ProcessBuilder($X)
      - pattern: $PB.command($X)
    languages: [java]
    severity: ERROR
    message: "Command Injection risk: User input may enter system command execution"
    metadata:
      cwe: "CWE-78"
      vuln_class: "Command Injection"

  - id: java-spel-injection
    pattern-either:
      - pattern: $P.parseExpression($X).getValue($C, $Y)
      - pattern: $P.parseExpression($X).getValue($C)
      - pattern: new SpelExpressionParser().parseExpression($X)
    languages: [java]
    severity: ERROR
    message: "SpEL Expression Injection risk"
    metadata:
      cwe: "CWE-94"
      vuln_class: "SpEL Injection"

  - id: java-ognl-injection
    pattern-either:
      - pattern: Ognl.getValue($X)
      - pattern: OgnlUtil.getValue($X)
      - pattern: $C.getValue($X)
    languages: [java]
    severity: ERROR
    message: "OGNL Expression Injection risk"
    metadata:
      cwe: "CWE-94"
      vuln_class: "OGNL Injection"

  - id: java-freemarker-ssti
    pattern-either:
      - pattern: $TE.process($X, $Y)
      - pattern: new Template($X).process($Y)
    languages: [java]
    severity: ERROR
    message: "FreeMarker Template Injection risk"
    metadata:
      cwe: "CWE-94"
      vuln_class: "FreeMarker SSTI"

  - id: java-velocity-ssti
    pattern-either:
      - pattern: Velocity.evaluate($X)
      - pattern: $VE.evaluate($X)
      - pattern: $VE.mergeTemplate($X)
    languages: [java]
    severity: ERROR
    message: "Velocity Template Injection risk"
    metadata:
      cwe: "CWE-94"
      vuln_class: "Velocity SSTI"

  - id: java-thymeleaf-s-ssti
    pattern: $TE.process($X, $Y)
    languages: [java]
    severity: ERROR
    message: "Thymeleaf Template Injection risk"
    metadata:
      cwe: "CWE-94"
      vuln_class: "Thymeleaf SSTI"

  - id: java-groovy-injection
    pattern-either:
      - pattern: $GS.evaluate($X)
      - pattern: new GroovyShell().evaluate($X)
      - pattern: GroovyClassLoader.parseClass($X)
    languages: [java]
    severity: ERROR
    message: "Groovy Code Injection risk"
    metadata:
      cwe: "CWE-94"
      vuln_class: "Groovy Code Injection"

  - id: java-javascript-engine-injection
    pattern-either:
      - pattern: $SM.getEngineByName($X).eval($Y)
      - pattern: new ScriptEngineManager().getEngineByName($X).eval($Y)
    languages: [java]
    severity: ERROR
    message: "JavaScript Engine Injection risk"
    metadata:
      cwe: "CWE-94"
      vuln_class: "JavaScript Engine Injection"

  - id: java-jndi-injection
    pattern-either:
      - pattern: new InitialContext().lookup($X)
      - pattern: LdapContext.lookup($X)
      - pattern: RmiContext.lookup($X)
      - pattern: $IC.lookup($X)
    languages: [java]
    severity: ERROR
    message: "JNDI Injection (may lead to RCE)"
    metadata:
      cwe: "CWE-502"
      vuln_class: "JNDI Injection"

  - id: java-unsafe-reflection
    pattern-either:
      - pattern: Class.forName($X).getMethod($Y).invoke($Z, ...)
      - pattern: Class.forName($X).getDeclaredMethod($Y).invoke($Z, ...)
    languages: [java]
    severity: ERROR
    message: "Unsafe Reflection Invocation risk"
    metadata:
      cwe: "CWE-470"
      vuln_class: "Unsafe Reflection"

  - id: java-path-traversal-file
    pattern-either:
      - pattern: new File($X)
      - pattern: new FileInputStream($X)
      - pattern: new FileOutputStream($X)
      - pattern: new FileReader($X)
      - pattern: new FileWriter($X)
      - pattern: Files.newInputStream($X, ...)
      - pattern: Files.newOutputStream($X, ...)
      - pattern: Files.readString($X)
      - pattern: Files.writeString($X, $Y)
      - pattern: Files.readAllBytes($X)
    languages: [java]
    severity: WARNING
    message: "Path Traversal risk: File path may contain user input"
    metadata:
      cwe: "CWE-22"
      vuln_class: "Path Traversal"

  - id: java-path-traversal-filenameutil
    pattern-either:
      - pattern: FilenameUtils.getName($X)
      - pattern: new File($X).getName()
    languages: [java]
    severity: WARNING
    message: "Path Traversal risk: Using unsafe filename handling"
    metadata:
      cwe: "CWE-22"
      vuln_class: "Path Traversal"

  - id: java-xxe-xmlreader
    pattern-either:
      - pattern: DocumentBuilderFactory.newInstance()
      - pattern: SAXParserFactory.newInstance()
      - pattern: XMLReaderFactory.createXMLReader()
    languages: [java]
    severity: WARNING
    message: "XXE risk: XML parser may not disable external entities"
    metadata:
      cwe: "CWE-611"
      vuln_class: "XXE Injection"

  - id: java-xxe-transformer
    pattern: TransformerFactory.newInstance()
    languages: [java]
    severity: WARNING
    message: "XXE risk: XSLT transformer may have XXE vulnerability"
    metadata:
      cwe: "CWE-611"
      vuln_class: "XXE Injection"

  - id: java-ssrf-urlconnection
    pattern-either:
      - pattern: new URL($X).openConnection()
      - pattern: new URL($X).openStream()
      - pattern: HttpURLConnection($X)
      - pattern: HttpsURLConnection($X)
    languages: [java]
    severity: WARNING
    message: "SSRF risk: URL may contain user-controllable input"
    metadata:
      cwe: "CWE-918"
      vuln_class: "SSRF"

  - id: java-ssrf-apache-httpclient
    pattern-either:
      - pattern: $HC.execute(new HttpGet($X))
      - pattern: $HC.execute(new HttpPost($X))
      - pattern: $HC.execute(new HttpUriRequest($X))
    languages: [java]
    severity: WARNING
    message: "SSRF risk: HTTP client request URL may contain user input"
    metadata:
      cwe: "CWE-918"
      vuln_class: "SSRF"

  - id: java-deserialization-unsafe
    pattern-either:
      - pattern: new ObjectInputStream($X)
      - pattern: $OIS.readObject()
      - pattern: XMLDecoder($X)
      - pattern: new XMLDecoder($X)
    languages: [java]
    severity: ERROR
    message: "Unsafe Deserialization risk"
    metadata:
      cwe: "CWE-502"
      vuln_class: "Unsafe Deserialization"

  - id: java-secret-hardcode-password
    pattern-regex: (password|passwd|secret|api[_-]?key|private[_-]?key|access[_-]?token)\s*(=|:)\s*["']([\w\-\+=/]{10,})["']
    languages: [java]
    severity: ERROR
    message: "Hardcoded Sensitive Information risk: Potential hardcoded password or key detected"
    metadata:
      cwe: "CWE-798"
      vuln_class: "Hardcoded Secret"

  - id: java-secret-hardcode-connection-string
    pattern-regex: (jdbc:|mongodb://|redis://|mysql://|postgresql://)\S+["']
    languages: [java]
    severity: ERROR
    message: "Hardcoded Database Connection String risk"
    metadata:
      cwe: "CWE-798"
      vuln_class: "Hardcoded DB Connection"

  - id: java-log-injection
    pattern-either:
      - pattern: $L.info($X)
      - pattern: $L.error($X)
      - pattern: $L.warn($X)
      - pattern: $L.debug($X)
      - pattern: System.out.println($X)
      - pattern: System.err.println($X)
    languages: [java]
    severity: INFO
    message: "Log Injection risk: User input may be recorded in log files"
    metadata:
      cwe: "CWE-117"
      vuln_class: "Log Injection"

  - id: java-ssrf-resttemplate
    pattern-either:
      - pattern: $RT.getForObject($X, ...)
      - pattern: $RT.postForObject($X, ...)
      - pattern: $RT.exchange($X, ...)
      - pattern: $RT.execute($X, ...)
    languages: [java]
    severity: WARNING
    message: "SSRF risk: RestTemplate request URL may contain user input"
    metadata:
      cwe: "CWE-918"
      vuln_class: "SSRF"

  - id: java-open-redirect
    pattern-either:
      - pattern: response.sendRedirect($X)
      - pattern: $R.sendRedirect($X)
      - pattern: $F.sendRedirect($X)
    languages: [java]
    severity: WARNING
    message: "Open Redirect risk: Redirect target may contain user input"
    metadata:
      cwe: "CWE-601"
      vuln_class: "Open Redirect"

  - id: java-xss-response-write
    pattern-either:
      - pattern: response.getWriter().write($X)
      - pattern: response.getWriter().print($X)
      - pattern: $R.getWriter().write($X)
      - pattern: $R.getWriter().print($X)
    languages: [java]
    severity: WARNING
    message: "XSS risk: User input directly written to response"
    metadata:
      cwe: "CWE-79"
      vuln_class: "XSS"