rules:
  - id: python-sqli
    pattern-either:
      - pattern: cursor.execute($X)
      - pattern: cursor.executemany($X)
    languages: [python]
    severity: ERROR
    message: "SQL Injection risk: SQL statement may contain user input"
    metadata:
      cwe: "CWE-89"
      vuln_class: "SQL Injection"

  - id: python-sqlalchemy-sqli
    pattern: $DB.session.execute($X)
    languages: [python]
    severity: WARNING
    message: "SQLAlchemy may have SQL Injection risk"
    metadata:
      cwe: "CWE-89"
      vuln_class: "SQL Injection"

  - id: python-command-injection-os-system
    pattern-either:
      - pattern: os.system($X)
      - pattern: os.popen($X)
      - pattern: os.spawn*$X
      - pattern: subprocess.call($X)
      - pattern: subprocess.run($X, shell=True)
    languages: [python]
    severity: ERROR
    message: "Command Injection risk: User input may enter system command"
    metadata:
      cwe: "CWE-78"
      vuln_class: "Command Injection"

  - id: python-command-injection-subprocess
    pattern-either:
      - pattern: subprocess.Popen($X, shell=True)
      - pattern: subprocess.Popen($X, ..., shell=True)
    languages: [python]
    severity: ERROR
    message: "Command Injection risk: User input may enter command when shell=True"
    metadata:
      cwe: "CWE-78"
      vuln_class: "Command Injection"

  - id: python-jinja2-ssti
    pattern-either:
      - pattern: template.render($X)
      - pattern: $T.render($X)
    languages: [python]
    severity: ERROR
    message: "Jinja2 SSTI risk: Template rendering may contain user input"
    metadata:
      cwe: "CWE-94"
      vuln_class: "Jinja2 SSTI"

  - id: python-django-ssti
    pattern: Template($X).render($C)
    languages: [python]
    severity: ERROR
    message: "Django Template Injection risk"
    metadata:
      cwe: "CWE-94"
      vuln_class: "Django SSTI"

  - id: python-eval-injection
    pattern-either:
      - pattern: eval($X)
      - pattern: exec($X)
    languages: [python]
    severity: ERROR
    message: "Code Injection risk: eval/exec may execute malicious code"
    metadata:
      cwe: "CWE-94"
      vuln_class: "Code Injection"

  - id: python-pickle-unsafe
    pattern-either:
      - pattern: pickle.loads($X)
      - pattern: pickle.load($X)
      - pattern: pickle.Unpickler($X).load()
      - pattern: cPickle.loads($X)
      - pattern: cPickle.load($X)
    languages: [python]
    severity: ERROR
    message: "Unsafe Deserialization risk: pickle may execute arbitrary code"
    metadata:
      cwe: "CWE-502"
      vuln_class: "Unsafe Pickle"

  - id: python-yaml-unsafe
    pattern-either:
      - pattern: yaml.load($X)
      - pattern: yaml.load($X, Loader=yaml.UnsafeLoader)
      - pattern: yaml.load($X, Loader=yaml.Loader)
    languages: [python]
    severity: ERROR
    message: "Unsafe YAML Load risk: May execute arbitrary code"
    metadata:
      cwe: "CWE-502"
      vuln_class: "Unsafe YAML Load"

  - id: python-path-traversal
    pattern-either:
      - pattern: open($X)
      - pattern: open($X, ...)
      - pattern: os.open($X)
      - pattern: os.path.join($X, $Y)
    languages: [python]
    severity: WARNING
    message: "Path Traversal risk: File path may contain user input"
    metadata:
      cwe: "CWE-22"
      vuln_class: "Path Traversal"

  - id: python-ssrf-requests
    pattern-either:
      - pattern: requests.get($X)
      - pattern: requests.post($X)
      - pattern: requests.put($X)
      - pattern: requests.delete($X)
      - pattern: requests.request($X, ...)
    languages: [python]
    severity: WARNING
    message: "SSRF risk: Request URL may contain user input"
    metadata:
      cwe: "CWE-918"
      vuln_class: "SSRF"

  - id: python-ssrf-urllib
    pattern-either:
      - pattern: urllib.request.urlopen($X)
      - pattern: urllib2.urlopen($X)
      - pattern: urllib2.Request($X)
    languages: [python]
    severity: WARNING
    message: "SSRF risk: urllib request URL may contain user input"
    metadata:
      cwe: "CWE-918"
      vuln_class: "SSRF"

  - id: python-xml-xxe
    pattern-either:
      - pattern: xml.etree.ElementTree.parse($X)
      - pattern: minidom.parse($X)
      - pattern: xml.dom.minidom.parse($X)
      - pattern: parseString($X)
    languages: [python]
    severity: WARNING
    message: "XXE risk: XML parsing may have external entity injection"
    metadata:
      cwe: "CWE-611"
      vuln_class: "XXE Injection"

  - id: python-xss-response
    pattern-either:
      - pattern: HttpResponse($X)
      - pattern: render($X, ...)
      - pattern: return render_template($X, $C)
    languages: [python]
    severity: WARNING
    message: "XSS risk: User input may be directly output to response"
    metadata:
      cwe: "CWE-79"
      vuln_class: "XSS"

  - id: python-secret-hardcode-password
    pattern-regex: '(password|passwd|secret|api[_-]?key|private[_-]?key|access[_-]?token)\s*(=|:)\s*["\']([\w\-\+=/]{10,})["\']'
    languages: [python]
    severity: ERROR
    message: "Hardcoded Sensitive Information risk: Potential hardcoded password or key detected"
    metadata:
      cwe: "CWE-798"
      vuln_class: "Hardcoded Secret"

  - id: python-secret-hardcode-db-url
    pattern-regex: '(mongodb://|redis://|mysql://|postgresql://|sqlite:///)\S+["\']'
    languages: [python]
    severity: ERROR
    message: "Hardcoded Database Connection String risk"
    metadata:
      cwe: "CWE-798"
      vuln_class: "Hardcoded DB Connection"

  - id: python-log-injection
    pattern-either:
      - pattern: logging.info($X)
      - pattern: logging.error($X)
      - pattern: logging.warn($X)
      - pattern: logging.warning($X)
      - pattern: logging.debug($X)
      - pattern: logger.info($X)
      - pattern: logger.error($X)
      - pattern: logger.warn($X)
      - pattern: logger.warning($X)
      - pattern: logger.debug($X)
    languages: [python]
    severity: INFO
    message: "Log Injection risk: User input may be recorded in logs"
    metadata:
      cwe: "CWE-117"
      vuln_class: "Log Injection"

  - id: python-open-redirect
    pattern-either:
      - pattern: redirect($X)
      - pattern: HttpResponseRedirect($X)
      - pattern: flask.redirect($X)
    languages: [python]
    severity: WARNING
    message: "Open Redirect risk: Redirect target may contain user input"
    metadata:
      cwe: "CWE-601"
      vuln_class: "Open Redirect"