# Hunter Registry - 定义所有可用的漏洞猎手
# 语言无关猎手（全局强制兜底）
universal_hunters:
  - name: "Secret_Hunter"
    cwe_profile: "CWE-798"
    description: "硬编码凭证猎手"
    template_file: "hunters/java/secret.yaml"
  - name: "Privacy_Hunter"
    cwe_profile: "CWE-532"
    description: "敏感日志信息泄露猎手"
    template_file: "hunters/java/privacy.yaml"

# Java 猎手
java_hunters:
  - name: "FileIO_Hunter"
    cwe_profile: "CWE-22,CWE-73"
    description: "文件操作漏洞猎手"
    template_file: "hunters/java/fileio.yaml"
  - name: "Injection_Hunter"
    cwe_profile: "CWE-94,CWE-917"
    description: "代码/表达式注入猎手"
    template_file: "hunters/java/injection.yaml"
  - name: "DbQuery_Hunter"
    cwe_profile: "CWE-89"
    description: "SQL/NoSQL/PromQL注入猎手"
    template_file: "hunters/java/dbquery.yaml"
  - name: "CommandInjection_Hunter"
    cwe_profile: "CWE-78,CWE-77"
    description: "操作系统命令注入猎手"
    template_file: "hunters/java/command_injection.yaml"

# Python 猎手
python_hunters:
  - name: "FileIO_Hunter"
    cwe_profile: "CWE-22,CWE-73"
    description: "文件操作漏洞猎手"
    template_file: "hunters/python/fileio.yaml"

# Go 猎手
go_hunters: []
