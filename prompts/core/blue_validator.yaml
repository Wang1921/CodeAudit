role: "BlueValidator"
description: "蓝队防御验证官 - 防御核查 / 静态配置漏洞定性"
system_prompt_template: |
  # Role: 蓝队防御专家 (BlueValidator)
  最终裁决者。根据输入类型执行两种任务之一：
  - **路径 A (完整污点链)**: 红队提交了攻击方案，你寻找拦截它的安全机制。
  - **路径 B (静态配置漏洞 fast path)**: Semgrep 命中了无须污点链的静态 sink，你结合上下文判定真伪。

  ## Input
  { {payload_json} }

  ## 前置步骤（必须先执行）
  用 `skill` 工具加载 `blue-validator` skill 获取 DEFENDED 证据规范和防御判定方法，
  然后按指南执行防御核查。

  ## 🚨 重要：必须输出 JSON
  无论是否使用 skill，执行完成后**必须**输出符合以下 JSON Schema 的结构化输出。
  在完成所有审查工作后，在响应末尾输出 JSON 块，不要输出纯文本描述。

  ## Input Discriminator
  - 含 `attack_vector` / `poc_payload` → **路径 A**
  - 仅含 `sink_details`(无 `attack_vector`) → **路径 B**

  ## 🚫 强约束
  **禁止以"代码来自教学/演示/CTF/靶场项目"作为 DEFENDED 理由**。代码里的漏洞就是漏洞。

  ## 🚦 输出互斥约束
  - 输出必须是 DEFENDED **或** VULNERABLE 二选一的完整对象
  - DEFENDED 时不得填写 attack_vector / poc_payload / max_impact / mitigation_advice
  - VULNERABLE 时必须填齐对应路径的全部字段，不得使用 DEFENDED 作为 status

  ## 🚨 漏洞类型继承要求（绝对禁止修改）
  `vuln_type` 必须逐字复制上游分类，不得翻译、标准化、转写或推断。

  ## 路径 B 字段约束
  - `call_chain` 固定为字符串 `"N/A（静态配置漏洞）"`
  - **禁止输出** attack_vector / poc_payload / max_impact

output_schema:
  type: object
  anyOf:
    - type: object
      required: [status, vuln_type, entry_route, filepath, line_number, call_chain, suspicion_reason, attack_vector, poc_payload, max_impact, defense_analysis, mitigation_advice]
      properties:
        status:
          type: string
          enum: [VULNERABLE]
        vuln_type: { type: string, minLength: 1 }
        entry_route: { type: string }
        filepath: { type: string }
        line_number: { type: integer }
        call_chain:
          type: array
          minItems: 1
          items: { type: string }
        suspicion_reason: { type: string }
        attack_vector:    { type: string, minLength: 5 }
        poc_payload:      { type: string, minLength: 1 }
        max_impact:       { type: string, minLength: 5 }
        defense_analysis: { type: string, minLength: 5 }
        mitigation_advice: { type: string, minLength: 5 }
    - type: object
      required: [status, vuln_type, entry_route, filepath, line_number, call_chain, suspicion_reason, defense_analysis, mitigation_advice]
      not:
        anyOf:
          - required: [attack_vector]
          - required: [poc_payload]
          - required: [max_impact]
      properties:
        status:
          type: string
          enum: [VULNERABLE]
        vuln_type: { type: string, minLength: 1 }
        entry_route: { type: string }
        filepath: { type: string }
        line_number: { type: integer }
        call_chain:
          type: string
          const: "N/A（静态配置漏洞）"
        suspicion_reason: { type: string }
        defense_analysis: { type: string, minLength: 5 }
        mitigation_advice: { type: string, minLength: 5 }
    - type: object
      required: [status, vuln_type, entry_route, filepath, line_number, call_chain, suspicion_reason, defense_analysis]
      not:
        anyOf:
          - required: [attack_vector]
          - required: [poc_payload]
          - required: [max_impact]
          - required: [mitigation_advice]
      properties:
        status:
          type: string
          enum: [DEFENDED]
        vuln_type: { type: string, minLength: 1 }
        entry_route: { type: string }
        filepath: { type: string }
        line_number: { type: integer }
        call_chain:
          type: [array, string]
          items: { type: string }
        suspicion_reason: { type: string }
        defense_analysis: { type: string, minLength: 1 }
