rules:
  # ---------------- 静态 / 零填充 IV ----------------
  - id: java-static-iv
    message: |
      🚨 Static / Zero-Filled IV (CWE-329) Sink:
      `IvParameterSpec` 使用零填充数组或硬编码字面量作为 IV。

      加密模式（CBC / GCM / CTR）的安全性依赖 IV 对于**每次加密**都是随机不重复的。
      固定 IV 导致：
      - **CBC 模式**: 相同明文加密出相同密文，模式泄露；可以发起 "chosen-plaintext" 攻击；
      - **GCM 模式**: IV 重用直接泄露 authentication key（GHASH），攻击者可伪造任意密文；
      - **CTR 模式**: IV+计数器重复等同于 keystream 重用 → 两份密文异或即可还原明文。

      修复建议：
      1. 每次加密用 `SecureRandom.nextBytes(iv)` 生成新 IV（16 字节 for AES-CBC / 12 字节 for GCM）；
      2. 把 IV 随密文一起存储 / 传输（IV 不是秘密，但必须唯一）；
      3. Spring Security 项目用 `Encryptors.stronger(...)`，底层 SecureRandom 管理。
    severity: ERROR
    languages: [java]
    metadata:
      cwe: ["CWE-329: Generation of Predictable IV with CBC Mode"]
      owasp: "A02:2021 - Cryptographic Failures"
      vuln_class: "Static IV"
      confidence: HIGH
      taint_required: false
    pattern-either:
      # new byte[N] —— Java 自动零填充，直接当 IV 使
      - pattern: new IvParameterSpec(new byte[$N])
      - pattern: new javax.crypto.spec.IvParameterSpec(new byte[$N])
      # 字面量字节数组：明显的"写死 IV"
      - pattern: new IvParameterSpec(new byte[]{...})
      - pattern: new javax.crypto.spec.IvParameterSpec(new byte[]{...})
      # 字符串.getBytes() 作 IV
      - pattern: new IvParameterSpec("...".getBytes())
      - pattern: new IvParameterSpec("...".getBytes(...))
      - pattern: new javax.crypto.spec.IvParameterSpec("...".getBytes())

  # ---------------- 常量 Salt（PBEKeySpec / BCrypt / PBEParameterSpec） ----------------
  - id: java-constant-salt
    message: |
      🚨 Constant Salt (CWE-760) Sink: 口令派生或哈希使用硬编码 salt。

      salt 的作用是让相同口令产生不同哈希，阻断"彩虹表"攻击。写死的 salt 让所有用户
      共享一个彩虹表前缀，等于没盐 —— 一旦泄露，批量爆破效率极高。

      修复建议：
      1. 每个用户 / 每次派生 **独立生成 salt**：`SecureRandom.nextBytes(salt)`；
      2. salt 长度 ≥ 16 字节；
      3. 与哈希值一起存储（salt 非秘密）；
      4. 用现成的口令哈希库：BCrypt `BCrypt.gensalt()` / Argon2 `Argon2.hash()` 内置随机 salt。
    severity: ERROR
    languages: [java]
    metadata:
      cwe: ["CWE-760: Use of a One-Way Hash with a Predictable Salt"]
      owasp: "A02:2021 - Cryptographic Failures"
      vuln_class: "Constant Salt"
      confidence: HIGH
      taint_required: false
    pattern-either:
      # PBEKeySpec(password, salt, iter, keyLen) —— salt 是硬编码
      - pattern: new PBEKeySpec($PWD, "...".getBytes(), ...)
      - pattern: new PBEKeySpec($PWD, "...".getBytes(...), ...)
      - pattern: new PBEKeySpec($PWD, new byte[]{...}, ...)
      - pattern: new javax.crypto.spec.PBEKeySpec($PWD, "...".getBytes(), ...)
      - pattern: new javax.crypto.spec.PBEKeySpec($PWD, new byte[]{...}, ...)
      # PBEParameterSpec(salt, iter)
      - pattern: new PBEParameterSpec("...".getBytes(), ...)
      - pattern: new PBEParameterSpec(new byte[]{...}, ...)
      - pattern: new javax.crypto.spec.PBEParameterSpec("...".getBytes(), ...)
      - pattern: new javax.crypto.spec.PBEParameterSpec(new byte[]{...}, ...)

  # ---------------- 非对称密钥长度不足 ----------------
  - id: java-insufficient-key-size
    message: |
      🚨 Insufficient Asymmetric Key Size (CWE-326) Sink: RSA / DSA / DH 密钥长度 < 2048 bit。

      - NIST SP 800-131A 已弃用 RSA/DSA ≤ 1024 位；
      - 2048 位是当前最低安全要求，长期保密建议 3072 或 4096；
      - DSA 推荐切到 ECDSA（256+ bit）或 EdDSA。

      修复建议：
      1. `keyGen.initialize(2048)` 或 `4096`；
      2. 签名场景改用 ECDSA（P-256 以上）；
      3. TLS/JWT 等协议栈用 HMAC SHA-256 以上或 RS256/PS256 + RSA 2048+。
    severity: ERROR
    languages: [java]
    metadata:
      cwe: ["CWE-326: Inadequate Encryption Strength"]
      owasp: "A02:2021 - Cryptographic Failures"
      vuln_class: "Weak Cryptography"
      confidence: HIGH
      taint_required: false
    patterns:
      - pattern-either:
          - pattern: |
              $KPG = KeyPairGenerator.getInstance("RSA");
              ...
              $KPG.initialize($SIZE);
          - pattern: |
              $KPG = KeyPairGenerator.getInstance("DSA");
              ...
              $KPG.initialize($SIZE);
          - pattern: |
              $KPG = KeyPairGenerator.getInstance("DiffieHellman");
              ...
              $KPG.initialize($SIZE);
          - pattern: |
              $KPG = java.security.KeyPairGenerator.getInstance("RSA");
              ...
              $KPG.initialize($SIZE);
          - pattern: |
              $KPG = java.security.KeyPairGenerator.getInstance("DSA");
              ...
              $KPG.initialize($SIZE);
      - metavariable-comparison:
          metavariable: $SIZE
          comparison: $SIZE < 2048
