rules:
  # --------- 显式设置 setSecure(false) 或 setHttpOnly(false) ---------
  - id: java-insecure-cookie-explicit-false
    message: |
      🚨 Insecure Cookie (CWE-614 / CWE-1004) Sink: Cookie 显式关闭安全属性。

      - `setSecure(false)` 让 Cookie 在 HTTP 明文信道传输，中间人可嗅探；
      - `setHttpOnly(false)` 让 JavaScript 可读 Cookie，XSS 能直接窃取会话。

      修复建议：
      1. 敏感 Cookie（session、token、CSRF）必须 `setSecure(true)` 且 `setHttpOnly(true)`；
      2. 现代 Spring Boot 可在 `application.yml` 全局设 `server.servlet.session.cookie.secure=true`
         和 `.http-only=true`；
      3. 再加 `setSameSite("Strict")` 或 `"Lax"` 防 CSRF；
      4. 生产环境 HTTPS 强制启用（`HSTS` + 301 跳转）。
    severity: ERROR
    languages: [java]
    metadata:
      cwe:
        - "CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"
        - "CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag"
      owasp: "A05:2021 - Security Misconfiguration"
      vuln_class: "Insecure Cookie"
      confidence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/614.html
        - https://owasp.org/www-community/controls/SecureCookieAttribute
    pattern-either:
      - pattern: $C.setSecure(false)
      - pattern: $C.setHttpOnly(false)

  # --------- Cookie 构造后直接 addCookie，缺失 setSecure/setHttpOnly ---------
  - id: java-insecure-cookie-missing-secure
    message: |
      🚨 Insecure Cookie (CWE-614) Sink: Cookie 构造后直接 `addCookie()` 加入响应，
      中间**没有**调用 `setSecure(true)` 或 `setHttpOnly(true)`。

      默认情况下 `javax.servlet.http.Cookie` 的 Secure/HttpOnly 都是 false，
      下发的 Cookie 可被中间人嗅探、被 JS 读取。只要是会话相关 Cookie 就必须两个都开。

      修复建议：
      1. `cookie.setSecure(true); cookie.setHttpOnly(true);` 在 `addCookie` 前调用；
      2. Spring Boot 用配置中心化设置，避免逐处写代码；
      3. 非敏感 Cookie（仅为前端 UI 偏好）可放宽，但业务 session/auth cookie 必须严格。
    severity: WARNING
    languages: [java]
    metadata:
      cwe:
        - "CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"
        - "CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag"
      owasp: "A05:2021 - Security Misconfiguration"
      vuln_class: "Insecure Cookie"
      confidence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/614.html
    patterns:
      - pattern: |
          $COOKIE = new Cookie(...);
          ...
          $RESP.addCookie($COOKIE);
      - pattern-not: |
          $COOKIE = new Cookie(...);
          ...
          $COOKIE.setSecure(true);
          ...
          $RESP.addCookie($COOKIE);
      - pattern-not: |
          $COOKIE = new Cookie(...);
          ...
          $COOKIE.setHttpOnly(true);
          ...
          $RESP.addCookie($COOKIE);
