rules:
  - id: java-insecure-trust-manager
    message: |
      🚨 Insecure TLS TrustManager / HostnameVerifier (CWE-295) Sink:
      空实现的 `X509TrustManager.checkServerTrusted()` 或 `HostnameVerifier.verify()` 恒返回 true。

      这等价于"关闭 TLS 证书校验"，攻击者在同网段实施中间人（MITM）时，
      被劫持的 HTTPS 流量不会被客户端察觉，凭证、会话、敏感数据全被拦截。
      该 bug 在移动 / 微服务 / 爬虫代码中极其常见。

      修复建议：
      1. 移除"接受所有证书"的代码，使用默认 TrustManager 走 JDK 内置 CA；
      2. 自签证书场景：将 CA 加到 `KeyStore` 里（`new KeyStore().load(caStream)`），
         而不是绕过校验；
      3. HostnameVerifier 只应按 CN/SAN 白名单返回 true，绝不允许恒 true；
      4. 测试 / mock 环境需特殊处理时，用 Profile 条件编译隔离生产代码。
    severity: ERROR
    languages: [java]
    metadata:
      cwe:
        - "CWE-295: Improper Certificate Validation"
      owasp: "A02:2021 - Cryptographic Failures"
      vuln_class: "Insecure TLS"
      confidence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/295.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Protection_Cheat_Sheet.html
    pattern-either:
      # ---------------- 空 checkServerTrusted / checkClientTrusted ----------------
      - pattern: |
          public void checkServerTrusted(X509Certificate[] $CHAIN, String $TYPE) { }
      - pattern: |
          public void checkServerTrusted(java.security.cert.X509Certificate[] $CHAIN, String $TYPE) { }
      - pattern: |
          public void checkClientTrusted(X509Certificate[] $CHAIN, String $TYPE) { }
      - pattern: |
          public void checkClientTrusted(java.security.cert.X509Certificate[] $CHAIN, String $TYPE) { }
      # getAcceptedIssuers 返回 null 或空数组（配合前两个是经典 "信任所有" 三件套）
      - pattern: |
          public X509Certificate[] getAcceptedIssuers() { return null; }
      - pattern: |
          public X509Certificate[] getAcceptedIssuers() { return new X509Certificate[0]; }
      - pattern: |
          public X509Certificate[] getAcceptedIssuers() { return new X509Certificate[]{}; }

      # ---------------- HostnameVerifier 恒真 ----------------
      - pattern: |
          public boolean verify(String $H, SSLSession $S) { return true; }
      - pattern: |
          public boolean verify(String $H, javax.net.ssl.SSLSession $S) { return true; }
      # lambda 形式
      - pattern: HttpsURLConnection.setDefaultHostnameVerifier((h, s) -> true)
      - pattern: javax.net.ssl.HttpsURLConnection.setDefaultHostnameVerifier((h, s) -> true)
      - pattern: $C.setHostnameVerifier((h, s) -> true)
      # NoopHostnameVerifier（Apache HttpClient 5）等同禁校验
      - pattern: NoopHostnameVerifier.INSTANCE
      - pattern: org.apache.hc.client5.http.ssl.NoopHostnameVerifier.INSTANCE
      - pattern: org.apache.http.conn.ssl.NoopHostnameVerifier.INSTANCE

      # ---------------- ALLOW_ALL 策略常量 ----------------
      - pattern: SSLConnectionSocketFactory.ALLOW_ALL_HOSTNAME_VERIFIER
      - pattern: org.apache.http.conn.ssl.SSLConnectionSocketFactory.ALLOW_ALL_HOSTNAME_VERIFIER
