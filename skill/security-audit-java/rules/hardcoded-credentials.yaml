rules:
  - id: java-hardcoded-credentials
    message: |
      🚨 Hardcoded Credentials (CWE-798 / CWE-259) Sink: 源码中硬编码了凭证或密钥。
      变量名含 `password` / `secret` / `token` / `apiKey` / `accessKey` / `privateKey`
      且直接赋值为字符串字面量，视为硬编码凭证。

      风险：源码泄露（Git 仓库、日志、反编译 jar）即等价于凭证泄露；
      同一凭证跨环境复用会放大影响面。

      该告警**无须污点链**（变量赋值点即漏洞），走 fast path 交给 BlueValidator
      结合上下文排除：测试类、示例值（"your-password-here"、"changeme"）、
      空串、默认占位值等假阳性。

      修复建议：
      1. 凭证经环境变量 / 配置中心 / 密钥管理服务 (Vault / KMS) 下发；
      2. Spring：`@Value("${app.secret}")` 从 `application.yml` 读取，yml 不入库；
      3. 敏感字段启用配置加密（Jasypt / Spring Cloud Config + KMS）；
      4. 严禁将 `application-prod.yml`、`*.p12`、`id_rsa` 等提交进 Git。
    severity: ERROR
    languages: [java]
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
        - "CWE-259: Use of Hard-coded Password"
      owasp: "A07:2021 - Identification and Authentication Failures"
      vuln_class: "Hardcoded Credentials"
      confidence: MEDIUM
      taint_required: false
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    patterns:
      - pattern-either:
          # 局部 / 字段：String xxx = "...";
          - pattern: String $NAME = "...";
          # final 常量
          - pattern: static final String $NAME = "...";
          - pattern: private static final String $NAME = "...";
          - pattern: public static final String $NAME = "...";
          - pattern: protected static final String $NAME = "...";
          # char[] 形式（Java 密码惯用）
          - pattern: char[] $NAME = "...".toCharArray();
      # 敏感命名
      - metavariable-regex:
          metavariable: $NAME
          regex: "(?i).*(password|passwd|pwd|secret|token|apikey|api_key|accesskey|access_key|privatekey|private_key|credential).*"
      # 排除明显的占位值 / 空串 / 极短测试值
      - pattern-not: String $NAME = "";
      - pattern-not: String $NAME = "changeme";
      - pattern-not: String $NAME = "your-password-here";
      - pattern-not: String $NAME = "xxx";
      - pattern-not: String $NAME = "example";
      - pattern-not: static final String $NAME = "";
      - pattern-not: private static final String $NAME = "";
      - pattern-not: public static final String $NAME = "";
      - pattern-not: protected static final String $NAME = "";
