rules:
  - id: java-unsafe-deserialization
    message: |
      🚨 Unsafe Deserialization (CWE-502) Sink: 反序列化接口接收非字面量数据。
      Java 原生 `readObject` 链路存在大量 gadget（CommonsCollections、ROME、
      Spring AOP 等），攻击者构造恶意字节流可直接 RCE；YAML / XStream 同理。

      修复建议：
      1. 避免对不可信数据做原生反序列化；
      2. 改用结构化、Schema 严格的协议（JSON + 具体类型）；
      3. SnakeYAML 改用 `new Yaml(new SafeConstructor())`；
      4. XStream 显式 `addPermission(NoTypePermission.NONE)` + 白名单允许类；
      5. `ObjectInputStream` 配合 `ObjectInputFilter` 做类白名单校验。
    severity: ERROR
    languages: [java]
    metadata:
      cwe:
        - "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      vuln_class: "Unsafe Deserialization"
      confidence: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/502.html
        - https://owasp.org/www-community/vulnerabilities/Deserialization_of_untrusted_data
    patterns:
      - pattern-either:
          # Java 原生反序列化
          - pattern: new ObjectInputStream($STREAM).readObject()
          - pattern: new ObjectInputStream($STREAM).readUnshared()
          - patterns:
              - pattern-either:
                  - pattern: $OIS.readObject()
                  - pattern: $OIS.readUnshared()
              - pattern-either:
                  - pattern-inside: |
                      ObjectInputStream $OIS = ...;
                      ...
                  - pattern-inside: |
                      ObjectInput $OIS = ...;
                      ...
          # XStream
          - pattern: $XSTREAM.fromXML($DATA, ...)
          # SnakeYAML（排除 SafeConstructor —— 安全用法）
          - patterns:
              - pattern-either:
                  - pattern: new Yaml().load($DATA, ...)
                  - pattern: new Yaml().loadAs($DATA, ...)
                  - pattern: new Yaml().loadAll($DATA, ...)
                  - pattern: new Yaml($CTOR, ...).load($DATA, ...)
                  - pattern: new Yaml($CTOR, ...).loadAs($DATA, ...)
                  - pattern: new Yaml($CTOR, ...).loadAll($DATA, ...)
              - pattern-not: new Yaml(new SafeConstructor(), ...).load($DATA, ...)
              - pattern-not: new Yaml(new SafeConstructor(), ...).loadAs($DATA, ...)
              - pattern-not: new Yaml(new SafeConstructor(), ...).loadAll($DATA, ...)
          # XMLDecoder —— 任何非字面量参数均高危，反序列化过程中执行 XML 中的字节码
          - pattern: new XMLDecoder($STREAM)
          - pattern: new java.beans.XMLDecoder($STREAM)
          # Jackson 多态反序列化：启用 DefaultTyping 后 readValue 即危险
          - patterns:
              - pattern: $OM.enableDefaultTyping(...)
              - metavariable-type:
                  metavariable: $OM
                  types:
                    - ObjectMapper
                    - com.fasterxml.jackson.databind.ObjectMapper
          - patterns:
              - pattern: $OM.activateDefaultTyping(...)
              - metavariable-type:
                  metavariable: $OM
                  types:
                    - ObjectMapper
                    - com.fasterxml.jackson.databind.ObjectMapper
          - patterns:
              - pattern: $OM.enableDefaultTypingAsProperty(...)
              - metavariable-type:
                  metavariable: $OM
                  types:
                    - ObjectMapper
                    - com.fasterxml.jackson.databind.ObjectMapper
          # Kryo —— 默认注册未开启或宽松时反序列化任意类
          - patterns:
              - pattern-either:
                  - pattern: $KRYO.readClassAndObject($INPUT)
                  - pattern: $KRYO.readObject($INPUT, ...)
                  - pattern: $KRYO.readObjectOrNull($INPUT, ...)
              - metavariable-type:
                  metavariable: $KRYO
                  types:
                    - Kryo
                    - com.esotericsoftware.kryo.Kryo
                    - com.esotericsoftware.kryo.kryo5.Kryo
          # Hessian
          - patterns:
              - pattern: $HI.readObject(...)
              - metavariable-type:
                  metavariable: $HI
                  types:
                    - HessianInput
                    - com.caucho.hessian.io.HessianInput
                    - Hessian2Input
                    - com.caucho.hessian.io.Hessian2Input
          # FastJson —— 显式启用 autoType 或使用允许 autoType 的 parse 接口
          - pattern: JSON.parseObject($DATA, Object.class)
          - pattern: com.alibaba.fastjson.JSON.parseObject($DATA, Object.class)
          - pattern: JSON.parse($DATA, Feature.SupportAutoType)
          - pattern: com.alibaba.fastjson.JSON.parse($DATA, Feature.SupportAutoType)
          - pattern: ParserConfig.getGlobalInstance().setAutoTypeSupport(true)
          - pattern: com.alibaba.fastjson.parser.ParserConfig.getGlobalInstance().setAutoTypeSupport(true)
          # FastJson 2.x
          - pattern: JSONReader.Feature.SupportAutoType
          - pattern: com.alibaba.fastjson2.JSONReader.Feature.SupportAutoType
          # FastJson 2.x —— JSON.parseObject 接收非字面量输入且目标类型为 Object / 无类型约束
          # 即使未显式开启 SupportAutoType，fastjson2 在特定配置下仍可能被绕过
          - patterns:
              - pattern-either:
                  - pattern: com.alibaba.fastjson2.JSON.parseObject($DATA)
                  - pattern: com.alibaba.fastjson2.JSON.parseObject($DATA, Object.class)
                  - pattern: com.alibaba.fastjson2.JSON.parse($DATA)
                  - pattern: com.alibaba.fastjson2.JSON.parseArray($DATA)
              - metavariable-type:
                  metavariable: $DATA
                  type: String
      # 字面量排除（readObject 无参数不需要排除；XStream / Yaml 可能传字面量）
      - pattern-not: $XS.fromXML("...", ...)
      - pattern-not: new Yaml().load("...", ...)
      - pattern-not: new Yaml(...).load("...", ...)
      - pattern-not: new Yaml().loadAs("...", ...)
      - pattern-not: new Yaml(...).loadAs("...", ...)
      - pattern-not: new Yaml().loadAll("...", ...)
      - pattern-not: new Yaml(...).loadAll("...", ...)
      # FastJson 2.x 字面量排除
      - pattern-not: com.alibaba.fastjson2.JSON.parseObject("...")
      - pattern-not: com.alibaba.fastjson2.JSON.parse("...")
      - pattern-not: com.alibaba.fastjson2.JSON.parseArray("...")
